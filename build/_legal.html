<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>%TITULO% · Jogos de Estudo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Página de ler: uma coluna estreita, as cores do índice. Montada por
   build/legal.py; o texto mora lá. */
:root{color-scheme:light dark;--fundo:oklch(0.975 0.008 265);--carta:oklch(1 0 0);--texto:oklch(0.28 0.030 268);
 --texto-2:oklch(0.50 0.028 268);--acao:oklch(0.52 0.20 265);--risco:oklch(0.905 0.012 265)}
@media (prefers-color-scheme:dark){:root{--fundo:oklch(0.205 0.028 272);--carta:oklch(0.262 0.030 272);
 --texto:oklch(0.975 0.008 272);--texto-2:oklch(0.80 0.020 272);--acao:oklch(0.74 0.15 265);--risco:oklch(0.365 0.030 272)}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Nunito,ui-sans-serif,system-ui,sans-serif;
 font-weight:600;font-size:1.0625rem;line-height:1.6}
main{max-width:40rem;margin:0 auto;padding:2rem 1rem 4rem}
nav{font-size:.9375rem;margin-bottom:1.5rem;display:flex;gap:1rem;flex-wrap:wrap}
a{color:var(--acao);text-underline-offset:.2em}
h1,h2{font-family:Fredoka,ui-rounded,sans-serif;line-height:1.2;text-wrap:balance}
h1{font-size:2rem;margin:0 0 .25rem}
h2{font-size:1.25rem;margin:2rem 0 .5rem}
p,li{max-width:65ch}
.versao{color:var(--texto-2);font-size:.9375rem;margin-top:0}
ul{padding-left:1.25rem}
li{margin:.35rem 0}
table{width:100%;border-collapse:collapse;font-size:.9375rem;background:var(--carta);border-radius:12px;overflow:hidden}
th,td{text-align:left;vertical-align:top;padding:.6rem .75rem;border-bottom:1px solid var(--risco)}
th{font-weight:800;color:var(--texto-2);font-size:.8125rem}
@media (max-width:34rem){
 table,thead,tbody,tr,td{display:block}thead{display:none}
 tr{padding:.5rem 0;border-bottom:1px solid var(--risco)}td{border:0;padding:.15rem .75rem}
 td:first-child{font-weight:800}
}
</style>
</head>
<body>
<main>
<nav><a href="index.html">Jogos de Estudo</a><a href="termos.html">Termos de uso</a><a href="privacidade.html">Privacidade</a></nav>
%CORPO%
</main>
</body>
</html>
