<svg id="fgSet1" data-estado="primario" viewBox="0 0 480 130" role="img" aria-label="Os três setores: o primário tira da natureza, o secundário transforma, o terciário vende e serve"><style>#fgSet1[data-estado="primario"] .c1{fill:var(--materia);opacity:.28}#fgSet1[data-estado="primario"] .r1{fill:var(--texto);font-weight:800}#fgSet1[data-estado="secundario"] .c2{fill:var(--materia);opacity:.28}#fgSet1[data-estado="secundario"] .r2{fill:var(--texto);font-weight:800}#fgSet1[data-estado="terciario"] .c3{fill:var(--materia);opacity:.28}#fgSet1[data-estado="terciario"] .r3{fill:var(--texto);font-weight:800}</style><rect class="z c1" x="10" y="30" width="138" height="62" rx="14"/><rect class="bolha" x="10" y="30" width="138" height="62" rx="14" fill="none"/><text class="forte r1" x="79" y="58" text-anchor="middle">primário</text><text class="fraca" x="79" y="78" text-anchor="middle">tira da natureza</text><path class="rot" d="M150 61h20"/><path class="rot" d="m164 55 6 6-6 6"/><rect class="z c2" x="172" y="30" width="138" height="62" rx="14"/><rect class="bolha" x="172" y="30" width="138" height="62" rx="14" fill="none"/><text class="forte r2" x="241" y="58" text-anchor="middle">secundário</text><text class="fraca" x="241" y="78" text-anchor="middle">transforma</text><path class="rot" d="M312 61h20"/><path class="rot" d="m326 55 6 6-6 6"/><rect class="z c3" x="334" y="30" width="138" height="62" rx="14"/><rect class="bolha" x="334" y="30" width="138" height="62" rx="14" fill="none"/><text class="forte r3" x="403" y="58" text-anchor="middle">terciário</text><text class="fraca" x="403" y="78" text-anchor="middle">vende e serve</text><text class="fraca" x="240" y="118" text-anchor="middle">o que um produz, o outro usa</text></svg>