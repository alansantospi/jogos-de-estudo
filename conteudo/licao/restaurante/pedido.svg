<svg viewBox="0 0 480 252" role="img" aria-label="O diálogo no restaurante, alternando garçom e cliente"><rect class="bolha on" x="10" y="8" width="340" height="30" rx="12"/><text x="24" y="28">How can I help you?</text><rect class="bolha" x="130" y="45" width="340" height="30" rx="12"/><text x="144" y="65">I'd like a hot dog, please.</text><rect class="bolha on" x="10" y="82" width="340" height="30" rx="12"/><text x="24" y="102">Here you are.</text><rect class="bolha" x="130" y="119" width="340" height="30" rx="12"/><text x="144" y="139">How much is it?</text><rect class="bolha on" x="10" y="156" width="340" height="30" rx="12"/><text x="24" y="176">It's one dollar and eighty-two cents.</text><rect class="bolha" x="130" y="193" width="340" height="30" rx="12"/><text x="144" y="213">OK. Here it is.</text><text class="fraca" x="240" y="246" text-anchor="middle">à esquerda o garçom, à direita o cliente</text></svg>