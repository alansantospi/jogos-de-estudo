-mode=\"treino\" onclick=\"setPracticeMode(true)\">Treino <small>sem vidas<\/small><\/button><button class=\"mode-opt\" data-mode=\"desafio\" onclick=\"setPracticeMode(false)\">Desafio <small>5 vidas<\/small><\/button><\/div><div class=\"busca\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-lupa\"/><\/svg><input type=\"search\" id=\"buscaMissao\" oninput=\"filtrarMissoes()\" autocomplete=\"off\" placeholder=\"Buscar assunto...\" aria-label=\"Buscar missão\" aria-controls=\"gradeMissoes\"><\/div><h2 style=\"margin-top:20px\">Trilhas<\/h2><!--%CARTOES%--><div style=\"margin-top:18px\"><button class=\"secondary\" onclick=\"goHome()\">← Voltar<\/button><\/div><\/div><\/section>\n<section id=\"quiz\" class=\"screen\"><div class=\"quiz-top\"><button class=\"exit-btn\" onclick=\"sairDaPartida()\">Sair da missão<\/button><\/div><div class=\"question-card\"><div class=\"progress-panel\"><div class=\"progress-head\"><span id=\"progressText\">Questão 1<\/span><span id=\"progressPct\">0%<\/span><\/div><div class=\"track\"><div id=\"fill\" class=\"fill\"><\/div><\/div><div id=\"trailMap\" class=\"trail-map\"><\/div><\/div><div id=\"stage\" class=\"stage\"><\/div><div id=\"fonte\" class=\"fonte\" style=\"display:none\"><\/div><div id=\"illustration\" class=\"illustration\"><\/div><div id=\"question\" class=\"question\"><\/div><div id=\"answers\" class=\"answers\"><\/div><div id=\"special\" class=\"special\"><\/div><div id=\"feedback\" class=\"feedback\" role=\"status\" aria-live=\"polite\"><\/div><div class=\"controls\"><button id=\"nextBtn\" class=\"primary\" style=\"display:none\" onclick=\"nextQuestion()\">Próxima →<\/button><\/div><\/div><\/section>\n\n<section id=\"sala\" class=\"screen\">\n  <div class=\"hero\">\n    <h2>Jogar com outras pessoas<\/h2>\n    <p>Um aparelho vira o telão e mostra as perguntas. Os outros entram pelo\n    código e respondem no próprio celular. <b>Este modo precisa de internet.<\/b><\/p>\n  <\/div>\n\n  <div id=\"salaEscolha\" class=\"sala-escolha\">\n    <button type=\"button\" class=\"primary\" onclick=\"criarSala()\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-tv\"/><\/svg> Ser o telão<\/button>\n    <button type=\"button\" class=\"ghost\" onclick=\"mostrarEntrada()\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-celular\"/><\/svg> Entrar numa sala<\/button>\n    <button type=\"button\" class=\"ghost\" onclick=\"goHome()\">Voltar ao início<\/button>\n  <\/div>\n\n  <div id=\"salaEntrada\" class=\"sala-caixa\" hidden>\n    <label class=\"sala-campo\"><span>Código da sala<\/span>\n      <input id=\"salaCodigo\" type=\"text\" inputmode=\"numeric\" maxlength=\"4\"\n             autocomplete=\"off\" placeholder=\"0000\"><\/label>\n    <label class=\"sala-campo\"><span>Seu nome<\/span>\n      <input id=\"salaNome\" type=\"text\" maxlength=\"12\" autocomplete=\"off\"\n             placeholder=\"Anne\"><\/label>\n    <button type=\"button\" class=\"primary\" onclick=\"entrarSala()\">Entrar<\/button>\n    <button type=\"button\" class=\"ghost\" onclick=\"voltarEscolha()\">Voltar<\/button>\n  <\/div>\n\n  <div id=\"salaAnfitriao\" class=\"sala-caixa\" hidden>\n    <div class=\"sala-codigo\"><span class=\"rot\">Código da sala<\/span>\n      <strong id=\"salaCodigoTela\">----<\/strong><\/div>\n    <p id=\"salaDica\" class=\"sala-dica\">Abra o mesmo endereço no celular de cada\n    jogador, toque em <b>Entrar numa sala<\/b> e digite o código.<br>\n    <b>Melhor com todos no mesmo Wi-Fi.<\/b> Em redes diferentes costuma\n    funcionar, mas em dados móveis pode não conectar.<br>\n    O telão não responde às perguntas: é preciso pelo menos um jogador para\n    começar.<\/p>\n    <div id=\"salaJogadores\" class=\"sala-jogadores\"><\/div>\n    <label class=\"sala-campo\"><span>Missão<\/span>\n      <select id=\"salaMissao\"><\/select><\/label>\n    <button type=\"button\" id=\"salaComecar\" class=\"primary\" onclick=\"comecarSala()\" disabled>\n      Esperando jogadores...<\/button>\n    <button type=\"button\" class=\"ghost\" onclick=\"fecharSala()\">Encerrar sala<\/button>\n  <\/div>\n\n  <div id=\"salaJogo\" class=\"sala-caixa\" hidden>\n    <div class=\"sala-topo\"><span id=\"salaProgresso\"><\/span>\n      <span id=\"salaTempo\" class=\"sala-tempo\">20<\/span><\/div>\n    <div id=\"salaPergunta\" class=\"question\"><\/div>\n    <div id=\"salaOpcoes\" class=\"answers\"><\/div>\n    <div id=\"salaPlacar\" class=\"sala-placar\"><\/div>\n  <\/div>\n\n  <div id=\"salaJogador\" class=\"sala-caixa\" hidden>\n    <div id=\"salaEstado\" class=\"sala-estado\">Esperando o telão começar...<\/div>\n    <div id=\"salaBotoes\" class=\"answers sala-botoes\"><\/div>\n    <div id=\"salaMeuPlacar\" class=\"sala-placar\"><\/div>\n  <\/div>\n<\/section>\n<section id=\"end\" class=\"screen\"><div class=\"result\"><div class=\"trophy\"><\/div><h2>Missão concluída!<\/h2><div id=\"rank\" class=\"rank\"><\/div><p id=\"endText\" class=\"subtitle\"><\/p><div class=\"summary\"><div class=\"stat\"><span class=\"small\">Pontos<\/span><strong id=\"finalScore\">0<\/strong><\/div><div class=\"stat\"><span class=\"small\">Acertos<\/span><strong id=\"finalHits\">0<\/strong><\/div><div class=\"stat\"><span class=\"small\">Precisão<\/span><strong id=\"accuracy\">0%<\/strong><\/div><div class=\"stat\"><span class=\"small\">Melhor combo<\/span><strong id=\"bestCombo\">0<\/strong><\/div><\/div><div id=\"missed\" class=\"missed\" style=\"display:none\"><\/div><div style=\"margin-top:16px\"><button class=\"gold\" onclick=\"openCategories()\">Escolher nova missão<\/button><\/div><\/div><\/section>\n<\/main><\/div><\/div>\n<script>\n\n/* ---------- perfis ---------- */\n/* A lista de perfis é a mesma nos quatro jogos e na página inicial. Cada\n   perfil tem a sua chave de progresso: trocar de aluno não apaga o do outro. */\nconst PERFIS_CHAVE = \"jogos_perfis_v1\";\nconst PERFIL_ATUAL = \"jogos_perfil_atual\";\nconst CORES_PERFIL = [\"--alt-1\", \"--alt-2\", \"--alt-3\", \"--alt-4\"];\n\nfunction lerPerfis(){\n  try{ return JSON.parse(localStorage.getItem(PERFIS_CHAVE)) || []; }\n  catch(e){ return []; }\n}\nfunction gravarPerfis(lista){\n  try{ localStorage.setItem(PERFIS_CHAVE, JSON.stringify(lista)); }catch(e){}\n}\nfunction perfilAtual(){\n  const lista = lerPerfis();\n  if(!lista.length) return null;\n  let id;\n  try{ id = localStorage.getItem(PERFIL_ATUAL); }catch(e){}\n  return lista.find(p => p.id === id) || lista[0];\n}\nfunction trocarPerfil(id){\n  try{ localStorage.setItem(PERFIL_ATUAL, id); }catch(e){}\n}\nfunction criarPerfil(nome){\n  const lista = lerPerfis();\n  const p = {id: \"p\" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),\n             nome: String(nome).trim().slice(0, 16) || \"Aluno\",\n             cor: CORES_PERFIL[lista.length % CORES_PERFIL.length],\n             criado: Date.now()};\n  lista.push(p); gravarPerfis(lista); trocarPerfil(p.id);\n  return p;\n}\nfunction inicialDe(nome){ return (nome || \"?\").trim().charAt(0).toUpperCase(); }\n\n/* A chave de progresso passa a levar o perfil. Sem perfil escolhido, o jogo\n   usa a chave antiga — é o progresso que já existia neste aparelho. */\nfunction chaveProgresso(base){\n  const p = perfilAtual();\n  return p ? base + \":\" + p.id : base;\n}\n\n/* Primeira vez com perfis: o que já estava salvo vira o perfil inicial, em\n   vez de a criança perder tudo o que fez. */\nfunction migrarProgresso(base){\n  try{\n    const antigo = localStorage.getItem(base);\n    if(!antigo) return;\n    if(!lerPerfis().length) criarPerfil(\"Aluno\");\n    const nova = chaveProgresso(base);\n    if(!localStorage.getItem(nova)) localStorage.setItem(nova, antigo);\n  }catch(e){}\n}\nconst FORMAS=[\"A\",\"B\",\"C\",\"D\"];\nconst NOMES_FORMA=FORMAS;\nconst SVG_SOM='<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-som\"/><\/svg>',SVG_MUDO='<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-mudo\"/><\/svg>';\n\n/*%BANK%*/\n/*%TRAILS%*/\n\n/* ---------- identidade estavel de cada questao (para o progresso) ---------- */\nObject.keys(bank).forEach(cat=>bank[cat].forEach((q,i)=>{q.id=cat+i;q.cat=cat}));\nconst allItems=Object.values(bank).flat();\n\nlet questions=[],index=0,score=0,lives=5,hits=0,answered=0,combo=0,bestCombo=0,\n    locked=false,activeTrail=null,trailStep=0,currentCategory=\"all\",practiceMode=true;\n\n/* ---------- progresso persistente ---------- */\nconst STORE_BASE=\"%CHAVE%\";\nconst STORE=(migrarProgresso(\"%CHAVE%\"), chaveProgresso(\"%CHAVE%\"));\nfunction defaultProgress(){return{items:{},best:{score:0,acc:0},trails:{},missions:{},practice:true,mudo:false}}\n\n// Estado de uma missão: nunca jogada, começada, concluída ou dominada.\nfunction missionStat(cat){return progress.missions[cat]||(progress.missions[cat]={iniciada:false,concluidas:0,melhorAcc:0})}\nfunction missionInfo(cat){\n  const m=progress.missions[cat]||{iniciada:false,concluidas:0,melhorAcc:0};\n  const itens = cat===\"all\" ? allItems : (bank[cat]||[]);\n  const dominadas = itens.filter(q=>{const t=progress.items[q.id];return t&&t.h>=2&&t.h>t.e}).length;\n  const pct = itens.length ? Math.round(dominadas/itens.length*100) : 0;\n  let estado=\"nova\", rotulo=\"\", icone=\"\";\n  if(m.concluidas&&m.melhorAcc>=90){estado=\"dominada\";icone=\"\";rotulo=\"Dominada\"}\n  else if(m.concluidas){estado=\"concluida\";icone=\"✓\";rotulo=\"Concluída\"}\n  else if(m.iniciada){estado=\"andamento\";icone=\"▶\";rotulo=\"Em andamento\"}\n  return {...m,dominadas,total:itens.length,pct,estado,rotulo,icone};\n}\nlet progress=defaultProgress();\nfunction loadProgress(){\n  try{\n    const raw=localStorage.getItem(STORE); if(!raw) return defaultProgress();\n    const p=JSON.parse(raw),d=defaultProgress();\n    return{items:p.items||d.items,best:p.best||d.best,trails:p.trails||d.trails,\n           missions:p.missions||d.missions,\n           practice:typeof p.practice===\"boolean\"?p.practice:d.practice,\n           mudo:!!p.mudo};\n  }catch(e){return defaultProgress()}\n}\nfunction saveProgress(){try{localStorage.setItem(STORE,JSON.stringify(progress))}catch(e){}}\nfunction stat(id){return progress.items[id]||(progress.items[id]={e:0,h:0})}\nfunction weakItems(){return allItems.filter(q=>{const t=progress.items[q.id];return t&&t.e>t.h})\n                                    .sort((a,b)=>(progress.items[b.id].e-progress.items[b.id].h)-(progress.items[a.id].e-progress.items[a.id].h))}\nfunction masteredItems(){return allItems.filter(q=>{const t=progress.items[q.id];return t&&t.h>=2&&t.h>t.e})}\nfunction record(q,ok){if(!q||!q.id)return;const t=stat(q.id);ok?t.h++:t.e++;saveProgress()}\n\n/* ---------- sorteio: uniforme e enviesado para o que o aluno erra ---------- */\nfunction shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}\nfunction weight(q){const t=progress.items[q.id];if(!t)return 3;const n=t.e-t.h;if(n>0)return Math.min(12,3+n*3);if(t.h>=2)return 1;return 2}\nfunction pickWeighted(list,n){\n  const pool=[...list],out=[];n=Math.min(n,pool.length);\n  while(out.length<n&&pool.length){\n    const w=pool.map(weight),tot=w.reduce((a,b)=>a+b,0);\n    let r=Math.random()*tot,i=0;\n    while(i<pool.length-1&&(r-=w[i])>0)i++;\n    out.push(pool.splice(i,1)[0]);\n  }\n  return out;\n}\n\n/* ---------- montagem da partida: sem repetir questao ---------- */\nconst TAM_PARTIDA=12, TAM_ETAPA=8;\nfunction makeQuestions(cat,limite){\n  let src;\n  if(cat===\"review\"){src=weakItems(); if(!src.length) return [];}\n  else src = cat===\"all\" ? allItems : bank[cat];\n  const alvo=Math.min(limite||TAM_PARTIDA, src.length);   // nunca pede mais do que existe\n  return pickWeighted(src,alvo).map(x=>{\n    const t=x.t||\"choice\";\n    if(t!==\"choice\") return {...x,t};\n    const choices=shuffle([x.c,...x.d]);\n    return {...x,t,choices,answer:choices.indexOf(x.c)};\n  });\n}\n\n/* ---------- telas ---------- */\nfunction show(id){migalhas(id);document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}\nfunction _goHome(){renderStats();renderModeToggle();show('start')}\n\n/* ---------- busca de missão ---------- */\n/* Sem acento e sem caixa: a criança digita \"relogio\" e acha \"Que horas são\".\n   Filtra por título e descrição, esconde grupo que ficou vazio. */\nfunction _chave(t){\n  return (t || \"\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g, \"\").toLowerCase();\n}\nfunction filtrarMissoes(){\n  const campo = document.getElementById(\"buscaMissao\");\n  const raiz  = document.getElementById(\"categories\");\n  if(!campo || !raiz) return;\n  const q = _chave(campo.value.trim());\n  let achou = 0;\n  raiz.querySelectorAll(\".category-card, .trail-card\").forEach(c => {\n    const bate = !q || _chave(c.textContent).includes(q);\n    c.hidden = !bate;\n    if(bate) achou++;\n  });\n  // Um título — de seção ou de grupo — só aparece se sobrou cartão embaixo.\n  raiz.querySelectorAll(\"h2, h3.grupo\").forEach(h => {\n    let vivo = false;\n    for(let n = h.nextElementSibling; n && !_ehTitulo(n); n = n.nextElementSibling){\n      if(_ehCartao(n)){ if(!n.hidden){ vivo = true; break; } continue; }\n      if(n.querySelector && n.querySelector(\".category-card:not([hidden]), .trail-card:not([hidden])\")){\n        vivo = true; break;\n      }\n    }\n    h.hidden = !vivo;\n  });\n  const vazio = document.getElementById(\"semResultado\");\n  if(vazio) vazio.hidden = achou > 0;\n}\nfunction _ehTitulo(n){ return n.tagName === \"H2\" || n.classList.contains(\"grupo\"); }\nfunction _ehCartao(n){\n  return n.classList.contains(\"category-card\") || n.classList.contains(\"trail-card\");\n}\n\n\nfunction _openCategories(){renderCards();renderModeToggle();show('categories')}\nfunction _openLesson(id){show('lesson');document.querySelectorAll('.lesson-part').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block'}\nfunction sairDaPartida(){if(index>0&&!confirm(\"Sair da missão? O progresso desta partida será perdido.\"))return;activeTrail=null;openCategories()}\n\n/* ---------- modo treino x desafio ---------- */\n/* ============================================================\n   SOM E FEEDBACK\n   Tudo em try/catch: o jogo nunca pode quebrar por causa de áudio.\n   ============================================================ */\n\nlet audioCtx=null, mudo=false;\n\nfunction ensureAudio(){\n  if(audioCtx) return audioCtx;\n  try{\n    const C=window.AudioContext||window.webkitAudioContext;\n    if(!C) return null;\n    audioCtx=new C();\n    if(audioCtx.state===\"suspended\") audioCtx.resume();\n    return audioCtx;\n  }catch(e){ return null; }\n}\n\n// Uma nota. `quando` permite encadear arpejos sem setTimeout.\nfunction nota(freq,dur=0.12,vol=0.05,tipo=\"sine\",quando=0){\n  if(mudo) return;\n  const ctx=ensureAudio(); if(!ctx) return;\n  try{\n    const t=ctx.currentTime+quando;\n    const osc=ctx.createOscillator(), g=ctx.createGain();\n    osc.type=tipo; osc.frequency.setValueAtTime(freq,t);\n    osc.connect(g); g.connect(ctx.destination);\n    g.gain.setValueAtTime(0.0001,t);\n    g.gain.exponentialRampToValueAtTime(vol,t+0.012);\n    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);\n    osc.start(t); osc.stop(t+dur+0.02);\n  }catch(e){}\n}\nfunction arpejo(freqs,passo=0.075,vol=0.05,tipo=\"sine\"){\n  freqs.forEach((f,i)=>nota(f,0.16,vol,tipo,i*passo));\n}\n\nconst sfx={\n  toque(){ nota(320,0.05,0.02,\"sine\"); },\n  acerto(){ arpejo([660,880],0.07,0.045); },\n  erro(){ nota(220,0.16,0.05,\"triangle\"); nota(165,0.22,0.045,\"triangle\",0.1); },\n  // O combo sobe de tom: quanto maior a sequência, mais alto e mais brilhante.\n  combo(n){\n    const base=520+Math.min(n,8)*45;\n    arpejo([base,base*1.25,base*1.5],0.06,0.05,\"triangle\");\n  },\n  etapa(){ arpejo([523,659,784],0.09,0.05); },\n  missao(){ arpejo([523,659,784,1047],0.1,0.055); setTimeout(()=>arpejo([784,1047],0.12,0.05),480); },\n  recorde(){ arpejo([784,988,1175,1568],0.09,0.06,\"triangle\"); },\n  fimDeVidas(){ arpejo([440,349,262],0.14,0.05,\"triangle\"); }\n};\n\n// Aviso flutuante no topo: conquistas, etapas concluídas, marcos de combo.\nfunction posicionarAviso(p){\n  // Abaixo do painel de progresso, para a trilha — que é o que o aviso está\n  // anunciando — continuar à vista. Fora da partida, abaixo do cabeçalho.\n  const alvo=document.querySelector(\"#quiz.active .progress-panel\")\n          || document.querySelector(\"header\");\n  const y=alvo?alvo.getBoundingClientRect().bottom+12:12;\n  p.style.setProperty(\"--aviso-topo\",Math.round(Math.max(y,12))+\"px\");\n}\n\nfunction marcarEtapaFechada(i){\n  const n=document.querySelectorAll(\"#trailMap .node\")[i];\n  if(!n) return;\n  n.classList.add(\"fechou\");\n  setTimeout(()=>n.classList.remove(\"fechou\"),700);\n}\n\nfunction mostrarConquista(txt,etapa){\n  const p=document.getElementById(\"conquista\");\n  if(!p) return;\n  p.classList.toggle(\"etapa\",!!etapa);\n  if(etapa) p.innerHTML=txt; else p.textContent=txt;\n  posicionarAviso(p);\n  p.classList.remove(\"show\");\n  void p.offsetWidth;              // reinicia a animação se já estava na tela\n  p.classList.add(\"show\");\n  clearTimeout(p._t);\n  p._t=setTimeout(()=>p.classList.remove(\"show\"),etapa?2800:2200);\n}\n\nconst MARCOS={3:\"Três seguidas\",5:\"Cinco seguidas\",8:\"Oito seguidas\",12:\"Doze seguidas — impressionante\"};\nfunction festeja(n){ if(MARCOS[n]) mostrarConquista(MARCOS[n]); }\n\nfunction setMudo(v){\n  mudo=!!v;\n  progress.mudo=mudo;\n  saveProgress();\n  const b=document.getElementById(\"btnSom\");\n  if(b){ b.innerHTML=mudo?SVG_MUDO:SVG_SOM; b.setAttribute(\"aria-label\",mudo?\"Ativar som\":\"Desativar som\"); }\n}\nfunction alternarSom(){ setMudo(!mudo); if(!mudo) sfx.toque(); }\n\n/* ---------- feedback visual ---------- */\n\n// Número que sobe e some, ancorado no card da questão.\nfunction pontosVoando(texto,bom){\n  try{\n    const alvo=document.getElementById(\"question\")||document.body;\n    const el=document.createElement(\"div\");\n    el.className=\"floater \"+(bom?\"bom\":\"ruim\");\n    el.textContent=texto;\n    alvo.appendChild(el);\n    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },1100);\n  }catch(e){}\n}\n\nfunction pulsarCombo(){\n  const el=document.getElementById(\"combo\");\n  if(!el||!el.parentNode) return;\n  const p=el.parentNode;\n  p.classList.remove(\"combo-pulse\");\n  void p.offsetWidth;              // reinicia a animação\n  p.classList.add(\"combo-pulse\");\n}\n\nfunction setPracticeMode(on){practiceMode=!!on;progress.practice=practiceMode;saveProgress();renderModeToggle();renderLives()}\nfunction renderModeToggle(){document.querySelectorAll('.mode-opt').forEach(b=>b.classList.toggle('active',(b.dataset.mode==='treino')===practiceMode))}\nfunction renderLives(){const e=document.getElementById('lives');if(e)e.textContent=practiceMode?'∞':String(lives)}\nfunction loseLife(){if(!practiceMode)lives--;renderLives()}\n\n/* ---------- inicio de partida ---------- */\nfunction reset(){index=0;score=0;lives=5;hits=0;answered=0;combo=0;bestCombo=0;locked=false}\nfunction _startCategory(cat){\n  activeTrail=null;trailStep=0;currentCategory=cat;\n  questions=makeQuestions(cat);\n  if(!questions.length){alert(\"Nada para revisar ainda. Jogue uma missão primeiro!\");openCategories();return}\n  missionStat(cat).iniciada=true;saveProgress();\n  reset();updateHud();show('quiz');renderQuestion();\n}\nfunction _startTrail(name){activeTrail=name;trailStep=0;reset();startTrailStep()}\nfunction startTrailStep(){\n  currentCategory=trails[activeTrail].steps[trailStep];\n  missionStat(currentCategory).iniciada=true;\n  questions=makeQuestions(currentCategory,TAM_ETAPA);\n  index=0;locked=false;updateHud();show('quiz');renderQuestion();\n}\nfunction updateHud(){document.getElementById('score').textContent=score;renderLives();document.getElementById('combo').textContent=combo;_acenderFoguinho(combo)}\n\n/* ---------- progresso da partida ---------- */\nfunction updateProgress(){\n  const total=Math.max(questions.length,1),pct=Math.round(index/total*100),t=trails[activeTrail];\n  document.getElementById('progressText').textContent=activeTrail\n    ?`${t.name} • Etapa ${trailStep+1}/${t.steps.length} • Questão ${Math.min(index+1,total)}/${total}`\n    :`Questão ${Math.min(index+1,total)}/${total}`;\n  document.getElementById('progressPct').textContent=pct+'%';\n  document.getElementById('fill').style.width=pct+'%';\n  const map=document.getElementById('trailMap');\n  if(!activeTrail){map.innerHTML='';return}\n  map.innerHTML=t.steps.map((s,i)=>{\n    const cls=i<trailStep?'done':i===trailStep?'current':'';\n    const line=i<t.steps.length-1?`<div class=\"line ${i<trailStep?'done':''}\"><\/div>`:'';\n    return `<div class=\"node ${cls}\">${i<trailStep?'✓':i+1}<\/div>${line}`}).join('');\n  const atual=map.querySelector('.current');\n  if(atual) atual.scrollIntoView({block:'nearest',inline:'center'});\n}\n\n/*%NOMES%*/\n\n/* ---------- utilidades comuns a todos os formatos ---------- */\nfunction norm(x){return String(x||\"\").trim().toLowerCase().replace(/[.!?,;]/g,\"\")\n  .normalize(\"NFD\").replace(/[̀-ͯ]/g,\"\").replace(/\\s+/g,\" \")}\n\nfunction zonas(){document.getElementById('answers').innerHTML='';document.getElementById('special').innerHTML=''}\n\n// Ponto unico de pontuacao: todo formato termina aqui.\nfunction resolve(ok,msg){\n  const q=questions[index];\n  answered++;record(q,ok);\n  if(ok){\n    score+=100;hits++;combo++;bestCombo=Math.max(bestCombo,combo);\n    pontosVoando(\"+100\",true);\n    if(combo>=3){sfx.combo(combo);pulsarCombo();festeja(combo)} else sfx.acerto();\n  }else{\n    loseLife();combo=0;\n    pontosVoando(practiceMode?\"−\":\"−1 vida\",false);\n    sfx.erro();\n  }\n  feedback(ok,(ok?'Muito bem! ':'')+(msg||q.e));\n  updateHud();\n}\n\n/* ---------- 1. múltipla escolha ---------- */\nfunction renderChoice(q){\n  const a=document.getElementById('answers');\n  q.choices.forEach((c,i)=>{\n    const b=document.createElement('button');\n    b.className='answer';b.type='button';\n    const marca=document.createElement('span');\n    marca.className='letra';marca.textContent=FORMAS[i%4];\n    const txt=document.createElement('span');txt.textContent=c;\n    b.append(marca,txt);\n    b.setAttribute('aria-label',`Alternativa ${NOMES_FORMA[i%4]}: ${c}`);\n    b.onclick=()=>{\n      if(locked)return;locked=true;\n      const buttons=[...document.querySelectorAll('.answer')];\n      b.classList.add(i===q.answer?'correct':'wrong');\n      if(i!==q.answer&&buttons[q.answer])buttons[q.answer].classList.add('correct');\n      resolve(i===q.answer);\n    };\n    a.appendChild(b);\n  });\n}\n\n/* ---------- 2. verdadeiro ou falso ---------- */\nfunction renderTF(q){\n  const a=document.getElementById('answers');\n  [['Verdadeiro',true],['Falso',false]].forEach(([label,val],i)=>{\n    const b=document.createElement('button');\n    b.className='answer tf-btn';b.type='button';\n    const mk=document.createElement('span');mk.className='letra';mk.textContent=FORMAS[i%4];\n    const tx=document.createElement('span');tx.textContent=label;b.append(mk,tx);\n    b.setAttribute('aria-label',`Alternativa ${i+1}: ${label}`);\n    b.onclick=()=>{\n      if(locked)return;locked=true;\n      b.classList.add(val===q.c?'correct':'wrong');\n      if(val!==q.c){const cert=[...a.children].find((_,j)=>(j===0)===q.c);if(cert)cert.classList.add('correct')}\n      resolve(val===q.c);\n    };\n    a.appendChild(b);\n  });\n}\n\n/* ---------- 3. rosa dos ventos clicável ---------- */\nconst ROSA=['NO','N','NE','O','','L','SO','S','SE'];\nconst CARDEAIS=['N','S','L','O'];\nfunction renderCompass(q){\n  const sp=document.getElementById('special');\n  const dica=document.createElement('div');dica.className='small';\n  dica.textContent='Clique na direção correta na rosa dos ventos.';\n  const g=document.createElement('div');g.className='rosa';\n  ROSA.forEach(cell=>{\n    const b=document.createElement('button');\n    b.type='button';\n    b.className='rosa-btn'+(cell===''?' centro':CARDEAIS.includes(cell)?' card':'');\n    b.textContent=cell;\n    if(cell===''){b.disabled=true;b.setAttribute('aria-hidden','true')}\n    else{\n      b.setAttribute('aria-label',cell);\n      b.onclick=()=>{\n        if(locked)return;locked=true;\n        const acertou=cell===q.target;\n        b.classList.add(acertou?'correct':'wrong');\n        if(!acertou){const alvo=[...g.children].find(x=>x.textContent===q.target);if(alvo)alvo.classList.add('correct')}\n        resolve(acertou,acertou?undefined:`A direção correta é ${q.target}. ${q.e}`);\n      };\n    }\n    g.appendChild(b);\n  });\n  sp.appendChild(dica);sp.appendChild(g);\n}\n\n/* ---------- 4. associação (colunas) ---------- */\nfunction renderMatch(q){\n  const sp=document.getElementById('special');\n  let sel=null,feitos=0,erros=0;\n  const dica=document.createElement('div');dica.className='small';\n  dica.textContent='Clique em um item da esquerda e depois no par correspondente da direita.';\n  const wrap=document.createElement('div');wrap.className='match';\n  const esq=document.createElement('div');esq.className='match-col';\n  const dir=document.createElement('div');dir.className='match-col';\n  const criar=(txt,lado,col)=>{\n    const b=document.createElement('button');\n    b.className='match-item';b.type='button';b.textContent=txt;\n    b.onclick=()=>{\n      if(locked||b.classList.contains('done'))return;\n      if(lado==='e'){[...esq.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;return}\n      if(!sel)return;\n      if(q.pairs.some(p=>p[0]===sel.textContent&&p[1]===txt)){\n        sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;feitos++;\n        if(feitos===q.pairs.length){\n          locked=true;\n          resolve(erros===0,erros===0?undefined:`Você completou, mas com ${erros} tentativa${erros>1?'s':''} errada${erros>1?'s':''}. ${q.e}`);\n        }\n      }else{\n        erros++;b.classList.add('wrong');sel.classList.remove('sel');sel=null;\n        setTimeout(()=>b.classList.remove('wrong'),450);\n      }\n    };\n    col.appendChild(b);\n  };\n  shuffle(q.pairs.map(p=>p[0])).forEach(t=>criar(t,'e',esq));\n  shuffle(q.pairs.map(p=>p[1])).forEach(t=>criar(t,'d',dir));\n  wrap.appendChild(esq);wrap.appendChild(dir);\n  sp.appendChild(dica);sp.appendChild(wrap);\n}\n\n/* ---------- 5. ordenar a sequência ---------- */\nfunction renderOrder(q){\n  const sp=document.getElementById('special');\n  const escolha=[];\n  const slot=document.createElement('div');slot.className='order-slot';\n  const banco=document.createElement('div');banco.className='order-bank';\n  const redesenhar=()=>{\n    slot.innerHTML='';\n    if(!escolha.length){const v=document.createElement('span');v.className='small';v.textContent='Clique nos itens na ordem correta...';slot.appendChild(v);return}\n    escolha.forEach((txt,i)=>{const c=document.createElement('span');c.className='order-chip';c.textContent=`${i+1}. ${txt}`;slot.appendChild(c)});\n  };\n  shuffle(q.seq).forEach(txt=>{\n    const b=document.createElement('button');\n    b.className='order-btn';b.type='button';b.textContent=txt;\n    b.onclick=()=>{\n      if(locked||b.disabled)return;\n      b.disabled=true;escolha.push(txt);redesenhar();\n      if(escolha.length===q.seq.length){\n        locked=true;\n        const ok=escolha.every((x,i)=>x===q.seq[i]);\n        resolve(ok,ok?undefined:`A ordem correta é: ${q.seq.join(' → ')}. ${q.e}`);\n      }\n    };\n    banco.appendChild(b);\n  });\n  const limpar=document.createElement('button');\n  limpar.className='secondary';limpar.type='button';limpar.textContent='Limpar';\n  limpar.onclick=()=>{if(locked)return;escolha.length=0;[...banco.children].forEach(b=>b.disabled=false);redesenhar()};\n  redesenhar();\n  sp.appendChild(slot);sp.appendChild(banco);sp.appendChild(limpar);\n}\n\n/* ---------- 6. digitar a resposta ---------- */\nfunction renderText(q){\n  const sp=document.getElementById('special');\n  const row=document.createElement('div');row.className='text-row';\n  const inp=document.createElement('input');\n  inp.id='resp';inp.type='text';inp.placeholder=q.ph||'Digite sua resposta...';\n  inp.autocomplete='off';inp.setAttribute('autocapitalize','none');\n  const b=document.createElement('button');\n  b.className='primary';b.type='button';b.textContent='Confirmar';\n  const confirmar=()=>{\n    if(locked)return;locked=true;\n    const ok=q.valid.some(v=>norm(v)===norm(inp.value));\n    resolve(ok,ok?undefined:`A resposta é: ${q.valid[0]}. ${q.e}`);\n  };\n  b.onclick=confirmar;\n  inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();confirmar()}};\n  row.appendChild(inp);row.appendChild(b);sp.appendChild(row);\n  setTimeout(()=>{try{inp.focus()}catch(e){}},50);\n}\n\nconst RENDER={choice:renderChoice,tf:renderTF,compass:renderCompass,match:renderMatch,order:renderOrder,text:renderText};\n\n\n/* ---------- rótulo de procedência ---------- */\n/* A fonte vem normalizada do conteúdo: {t:\"livro\"|\"folha\", d:\"p.49\"}. Antes\n   cada jogo escrevia à sua maneira e cada motor tinha o seu formatador. */\nfunction rotuloFonte(src){\n  if(!src) return \"\";\n  if(typeof src === \"string\") return src;          // conteúdo antigo, se houver\n  if(src.t === \"livro\") return \"Livro, \" + src.d;\n  if(src.t === \"folha\") return \"Folha da escola\" + (src.d ? \", \" + src.d : \"\");\n  return src.d || \"\";\n}\n\nfunction renderQuestion(){\n  if(lives<=0){endGame();return}\n  if(index>=questions.length){\n    if(activeTrail&&trailStep<trails[activeTrail].steps.length-1){\n      const fechada=trailStep;\n      trailStep++;sfx.etapa();\n      const tr=trails[activeTrail];\n      mostrarConquista(\n        `<span class=\"aviso-t\"><svg class=\\\"ic-txt\\\" viewBox=\\\"0 0 24 24\\\" aria-hidden=\\\"true\\\"><use href=\\\"#i-check\\\"/><\/svg> Etapa ${fechada+1} de ${tr.steps.length} concluída<\/span>`+\n        `<span class=\"aviso-s\">Agora: ${nomes[tr.steps[trailStep]]||''}<\/span>`, true);\n      startTrailStep();marcarEtapaFechada(fechada);return;\n    }\n    endGame();return;\n  }\n  updateProgress();\n  const q=questions[index];\n  document.getElementById('stage').textContent=nomes[currentCategory]||currentCategory;\n  // Questões tiradas do capítulo do livro ganham um selo, para o aluno reconhecer o que já caiu.\n  const fonte=document.getElementById('fonte');\n  if(fonte){\n    // As questões vêm de duas fontes: o livro (p.NN) e a folha de revisão da escola.\n    fonte.innerHTML = rotuloFonte(q.src);\n    fonte.style.display = q.src ? 'inline-block' : 'none';\n  }\n  const il=document.getElementById('illustration');\n  il.innerHTML = q.ic\n    ? '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-'+q.ic+'\"/><\/svg>' : '';\n  il.style.display = q.ic ? '' : 'none';\n  document.getElementById('question').textContent=q.q;\n  const f=document.getElementById('feedback');f.className='feedback';f.textContent='';\n  document.getElementById('nextBtn').style.display='none';\n  zonas();\n  locked=false;\n  (RENDER[q.t]||renderChoice)(q);\n}\n\nfunction feedback(ok,msg){\n  const f=document.getElementById('feedback');\n  f.className='feedback show '+(ok?'good':'bad');\n  f.innerHTML='<span class=\"rotulo\">'+(ok?'Certo':'Ainda não')+'<\/span>';f.append(msg);\n  document.getElementById('nextBtn').style.display='inline-block';\n}\nfunction nextQuestion(){index++;renderQuestion()}\n\n/* ---------- atalhos de teclado ---------- */\ndocument.addEventListener('keydown',ev=>{\n  if(!document.getElementById('quiz').classList.contains('active'))return;\n  if(ev.target&&ev.target.tagName==='INPUT')return;   // o campo de texto trata o Enter sozinho\n  const btn=document.getElementById('nextBtn');\n  if(ev.key==='Enter'||ev.key===' '){\n    if(btn.style.display!=='none'){ev.preventDefault();nextQuestion()}\n    return;\n  }\n  const n=parseInt(ev.key,10);\n  if(n>=1&&n<=4&&!locked){\n    const b=document.querySelectorAll('.answer')[n-1];\n    if(b){ev.preventDefault();b.click()}\n  }\n});\n\n/* ---------- fim de partida ---------- */\nfunction endGame(){\n  registrarPartida(hits, answered, score);\n  setTimeout(() => comemorar(hits, answered), 260);\n  if(activeTrail&&trailStep>=trails[activeTrail].steps.length-1&&lives>0){progress.trails[activeTrail]=true}\n  // Registra a missão como concluída quando o aluno chegou ao fim com vidas.\n  if(answered&&(lives>0||practiceMode)){\n    const m=missionStat(currentCategory);\n    m.iniciada=true;m.concluidas++;\n    const a=Math.round(hits/answered*100);\n    if(a>m.melhorAcc)m.melhorAcc=a;\n  }\n  // denominador = questoes efetivamente respondidas (vale para trilhas de varias etapas\n  // e para partidas encerradas antes do fim)\n  const acc=answered?Math.round(hits/answered*100):0;\n  if(!practiceMode&&answered){\n    if(score>progress.best.score)progress.best.score=score;\n    if(acc>progress.best.acc)progress.best.acc=acc;\n  }\n  saveProgress();\n  if(lives<=0&&!practiceMode) sfx.fimDeVidas();\n  else if(!practiceMode&&score>0&&score>=progress.best.score) sfx.recorde();\n  else sfx.missao();\n  show('end');\n  document.getElementById('finalScore').textContent=score;\n  document.getElementById('finalHits').textContent=hits+'/'+answered;\n  document.getElementById('accuracy').textContent=acc+'%';\n  document.getElementById('bestCombo').textContent=bestCombo;\n  const rank=%PATENTE%;\n  document.getElementById('rank').textContent=rank;\n  document.getElementById('endText').textContent=\n    lives<=0&&!practiceMode?'As energias acabaram! Revise a lição e tente de novo.':\n    acc>=90?'Excelente domínio dos conteúdos!':\n    acc>=70?'Muito bom! Você já compreende bem o céu e a orientação.':\n    'Continue explorando e tente novamente para consolidar o conteúdo.';\n  renderMissed();\n}\n\n/* ---------- paineis de progresso ---------- */\nfunction renderStats(){\n  const el=document.getElementById('startStats');if(!el)return;\n  const feitas=Object.keys(trails).filter(k=>progress.trails[k]).length;\n  el.innerHTML=`<span class=\"chip\">Recorde <b>${progress.best.score}<\/b><\/span>`+\n    `<span class=\"chip\">Dominadas <b>${masteredItems().length}/${allItems.length}<\/b><\/span>`+\n    `<span class=\"chip\">A revisar <b>${weakItems().length}<\/b><\/span>`+\n    `<span class=\"chip\">Trilhas <b>${feitas}/${Object.keys(trails).length}<\/b><\/span>`;\n}\nfunction renderCards(){\n  // Cada card mostra em que pé está a missão e quanto do conteúdo já foi dominado.\n  document.querySelectorAll('[data-cat]').forEach(card=>{\n    const info=missionInfo(card.dataset.cat);\n    card.classList.remove('nova','andamento','concluida','dominada');\n    card.classList.add(info.estado);\n    const selo=card.querySelector('.selo');\n    if(selo){\n      selo.textContent=info.rotulo?`${info.icone} ${info.rotulo}`:'';\n      selo.style.display=info.rotulo?'inline-block':'none';\n    }\n    const barra=card.querySelector('.mini-bar span');\n    if(barra) barra.style.width=info.pct+'%';\n    const txt=card.querySelector('.mini-txt');\n    if(txt) txt.textContent=info.total?`${info.dominadas}/${info.total} dominadas`+(info.melhorAcc?` • melhor ${info.melhorAcc}%`:''):'';\n  });\n  const n=weakItems().length,c=document.getElementById('reviewCard');\n  if(c){\n    const t=c.querySelector('.review-count');\n    if(t)t.textContent=n?`${n} questã${n>1?'ões':'o'} esperando revisão`:'Nada pendente — jogue uma missão primeiro';\n    c.classList.toggle('empty',n===0);\n  }\n  document.querySelectorAll('[data-trail]').forEach(b=>{\n    const d=!!progress.trails[b.dataset.trail];\n    b.classList.toggle('done',d);\n    const s=b.querySelector('.trail-done');if(s)s.style.display=d?'inline-block':'none';\n  });\n}\nfunction renderMissed(){\n  const box=document.getElementById('missed');if(!box)return;\n  const w=weakItems().slice(0,5);\n  if(!w.length){box.style.display='none';box.innerHTML='';return}\n  box.style.display='block';\n  box.innerHTML=`<div class=\"missed-title\">Conteúdos que ainda pedem atenção<\/div>`+\n    `<ul class=\"missed-list\">${w.map(q=>`<li>${q.ic ? '<svg class=\"ic-txt\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-'+q.ic+'\"/><\/svg>' : ''}<span>${q.q}<\/span><\/li>`).join('')}<\/ul>`+\n    `<button type=\"button\" class=\"gold\" onclick=\"startCategory('review')\">Revisar só esses<\/button>`;\n}\nfunction resetProgress(){\n  if(!confirm(\"Apagar todo o progresso salvo?\"))return;\n  progress=defaultProgress();progress.practice=practiceMode;saveProgress();\n  renderStats();renderCards();\n}\n\n/* ---------- init ---------- */\nprogress=loadProgress();practiceMode=progress.practice;mudo=!!progress.mudo;setMudo(mudo);\nrenderModeToggle();renderLives();renderStats();\n\n\n/* ---------- rotas: a tela mora na URL ---------- */\n/* As funções públicas só escrevem o endereço; quem muda de tela é o\n   roteador. É o que faz o botão voltar do celular recuar uma tela em vez\n   de sair do jogo, e recarregar cair de volta onde estava. */\nconst _PRIMEIRA_LICAO = \"lesson1\";\nconst ROTAS = {\n  inicio:  function(){ _goHome(); },\n  licao:   function(a){ _openLesson(a || _PRIMEIRA_LICAO); },\n  missoes: function(){ _openCategories(); },\n  missao:  function(a){ a ? _startCategory(a) : _openCategories(); },\n  trilha:  function(a){ a ? _startTrail(a) : _openCategories(); }\n};\n\nfunction irPara(r){\n  // Mesmo endereço não dispara hashchange: refaz a rota (rejogar a missão).\n  if(location.hash === \"#\" + r) rota(); else location.hash = r;\n}\nfunction rota(){\n  const bruto = (location.hash || \"#inicio\").slice(1);\n  const barra = bruto.indexOf(\"/\");\n  const tipo  = barra < 0 ? bruto : bruto.slice(0, barra);\n  const arg   = barra < 0 ? \"\"    : decodeURIComponent(bruto.slice(barra + 1));\n  (ROTAS[tipo] || ROTAS.inicio)(arg);\n}\nfunction goHome(){ irPara(\"inicio\"); }\nfunction openCategories(){ irPara(\"missoes\"); }\nfunction openLesson(id){ irPara(\"licao/\" + id); }\nfunction startCategory(c){ irPara(\"missao/\" + encodeURIComponent(c)); }\nfunction startTrail(t){ irPara(\"trilha/\" + encodeURIComponent(t)); }\naddEventListener(\"hashchange\", rota);\n\n/* ---------- trilha de migalhas ---------- */\nconst _AQUI = {lesson:\"Lição\", categories:\"Missões\", quiz:null, end:\"Resultado\",\n              sala:\"Sala em rede\"};\nfunction migalhas(id){\n  const el = document.getElementById(\"migalhaAqui\");\n  if(!el) return;\n  let nome = _AQUI[id];\n  if(id === \"quiz\"){\n    // Na partida, a última migalha é a missão ou a trilha em curso.\n    nome = activeTrail ? (trails[activeTrail] && trails[activeTrail].name)\n                       : _nomeDaMissao(currentCategory);\n    el.innerHTML = ' <span class=\"migalha-sep\" aria-hidden=\"true\">/<\/span> '\n                 + '<a href=\"#missoes\">Missões<\/a>'\n                 + ' <span class=\"migalha-sep\" aria-hidden=\"true\">/<\/span> '\n                 + '<b>' + (nome || \"Missão\") + '<\/b>';\n    return;\n  }\n  el.innerHTML = nome\n    ? ' <span class=\"migalha-sep\" aria-hidden=\"true\">/<\/span> <b>' + nome + '<\/b>'\n    : \"\";\n}\n\nfunction _nomeDaMissao(c){ return (typeof nomes !== \"undefined\" && nomes[c]) || c; }\n\nif(document.readyState !== 'loading') rota();\nelse addEventListener('DOMContentLoaded', rota);\n\n/* ---------- tema: sistema, claro, escuro ---------- */\nconst TEMAS = [\"sistema\", \"claro\", \"escuro\"];\nconst _ICONE_TEMA = {sistema: '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-tema\"/><\/svg>', claro: '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-sol\"/><\/svg>', escuro: '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-lua\"/><\/svg>'};\nconst _ROTULO_TEMA = {sistema: \"Tema: seguir o sistema\",\n                      claro: \"Tema: claro\", escuro: \"Tema: escuro\"};\nfunction temaAtual(){\n  try{ return localStorage.getItem(\"tema\") || \"sistema\"; }catch(e){ return \"sistema\"; }\n}\nfunction aplicarTema(t){\n  if(t === \"sistema\") delete document.documentElement.dataset.tema;\n  else document.documentElement.dataset.tema = t;\n  try{ localStorage.setItem(\"tema\", t); }catch(e){}\n  const b = document.getElementById(\"btnTema\");\n  if(b){ b.innerHTML = _ICONE_TEMA[t]; b.setAttribute(\"aria-label\", _ROTULO_TEMA[t]); }\n}\nfunction alternarTema(){\n  aplicarTema(TEMAS[(TEMAS.indexOf(temaAtual()) + 1) % TEMAS.length]);\n  if(typeof sfx !== \"undefined\") sfx.toque();\n}\n\n/* ---------- tela cheia ---------- */\n/* O iPhone não expõe requestFullscreen em elementos: lá o botão nem aparece,\n   em vez de aparecer e não fazer nada. */\nfunction _temTelaCheia(){\n  return !!(document.documentElement.requestFullscreen);\n}\nfunction alternarTela(){\n  try{\n    if(document.fullscreenElement) document.exitFullscreen();\n    else document.documentElement.requestFullscreen();\n  }catch(e){}\n}\nfunction _pintarBotaoTela(){\n  const b = document.getElementById(\"btnTela\");\n  if(!b) return;\n  const cheia = !!document.fullscreenElement;\n  b.innerHTML = cheia ? '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-encolher\"/><\/svg>' : '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#i-expandir\"/><\/svg>';\n  b.setAttribute(\"aria-label\", cheia ? \"Sair da tela cheia\" : \"Tela cheia\");\n}\n\n/* ---------- estímulos ---------- */\n/* O foguinho troca o número da pílula de sequência por chama a partir de 3:\n   a criança vê a sequência crescer sem precisar ler. */\nfunction _acenderFoguinho(n){\n  const p = document.getElementById(\"combo\");\n  if(!p) return;\n  const caixa = p.closest(\".pill\");\n  if(caixa) caixa.classList.toggle(\"em-chamas\", n >= 3);\n  // `hidden` é propriedade de HTMLElement, não de SVGElement: atribuir a\n  // `.hidden` num <svg> cria uma propriedade solta e deixa o atributo no DOM.\n  const fogo = document.getElementById(\"foguinho\");\n  if(fogo) fogo.toggleAttribute(\"hidden\", n < 3);\n}\n\nfunction _ruido(dur, corte, vol){\n  /* Palmas são ruído filtrado, não nota: um estalo curto e seco. */\n  if(!audioCtx || mudo) return;\n  const n = Math.floor(audioCtx.sampleRate * dur);\n  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);\n  const dados = buf.getChannelData(0);\n  for(let i = 0; i < n; i++) dados[i] = (Math.random() * 2 - 1) * (1 - i / n);\n  const src = audioCtx.createBufferSource(); src.buffer = buf;\n  const f = audioCtx.createBiquadFilter(); f.type = \"bandpass\";\n  f.frequency.value = corte; f.Q.value = 0.8;\n  const g = audioCtx.createGain(); g.gain.value = vol;\n  src.connect(f).connect(g).connect(audioCtx.destination);\n  src.start();\n}\nfunction palmas(){\n  /* Doze palmas com intervalo irregular: regular demais vira metrônomo. */\n  try{\n    if(typeof ensureAudio === \"function\") ensureAudio();\n    for(let i = 0; i < 12; i++){\n      const atraso = i * 95 + Math.random() * 55;\n      setTimeout(() => _ruido(0.07, 1400 + Math.random() * 900, 0.16), atraso);\n    }\n  }catch(e){}\n}\n\nconst _CORES_FESTA = [\"--materia-solida\", \"--alt-1\", \"--alt-2\", \"--alt-3\", \"--alt-4\", \"--certo\"];\nfunction festa(quantidade){\n  if(matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n  const caixa = document.getElementById(\"festaBox\");\n  if(!caixa) return;\n  const n = quantidade || 44;\n  for(let i = 0; i < n; i++){\n    const p = document.createElement(\"i\");\n    p.className = \"confete\";\n    p.style.left = (Math.random() * 100) + \"vw\";\n    p.style.background = \"var(\" + _CORES_FESTA[i % _CORES_FESTA.length] + \")\";\n    p.style.animationDelay = (Math.random() * 0.45) + \"s\";\n    p.style.animationDuration = (1.5 + Math.random() * 1.1) + \"s\";\n    p.style.setProperty(\"--giro\", (Math.random() * 720 - 360) + \"deg\");\n    p.style.setProperty(\"--desvio\", (Math.random() * 120 - 60) + \"px\");\n    caixa.appendChild(p);\n    setTimeout(() => p.remove(), 3000);\n  }\n}\n\n/* Chamado no fim da partida: festa e palmas só quando houve o que comemorar. */\nfunction comemorar(acertos, total){\n  const pct = total ? acertos / total : 0;\n  if(pct >= 0.9){ festa(70); palmas(); }\n  else if(pct >= 0.6){ festa(36); }\n}\n\naddEventListener(\"DOMContentLoaded\", () => {\n  aplicarTema(temaAtual());\n  const b = document.getElementById(\"btnTela\");\n  if(b && _temTelaCheia()){ b.hidden = false; _pintarBotaoTela(); }\n  addEventListener(\"fullscreenchange\", _pintarBotaoTela);\n});\n\n/* ---------- sala em rede ---------- */\n/* WebRTC direto entre os aparelhos: nenhum servidor nosso no meio. O único\n   intermediário é o broker público do PeerJS, e só para eles se acharem. */\nconst SALA_PREFIXO = \"%SALA%\";\nconst SALA_PRAZO = 20000;       // por pergunta\nconst SALA_MAX = 8;\nconst SALA_LIB = \"https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js\";\n\nlet _peer = null, _souTelao = false, _conexoes = [], _conAnfitriao = null;\nlet _jogadores = new Map();     // id -> {nome, pontos, respondeu, con}\nlet _perguntas = [], _iPergunta = -1, _tInicio = 0, _relogio = null;\n\nfunction _tela(id){\n  [\"salaEscolha\",\"salaEntrada\",\"salaAnfitriao\",\"salaJogo\",\"salaJogador\"]\n    .forEach(x => { const e = document.getElementById(x); if(e) e.hidden = x !== id; });\n}\nfunction mostrarEntrada(){ _tela(\"salaEntrada\"); }\nfunction voltarEscolha(){ _tela(\"salaEscolha\"); }\n\nfunction _carregarPeer(){\n  if(window.Peer) return Promise.resolve();\n  return new Promise((ok, falha) => {\n    const s = document.createElement(\"script\");\n    s.src = SALA_LIB;\n    s.onload = ok;\n    s.onerror = () => falha(new Error(\"sem rede\"));\n    document.head.appendChild(s);\n  });\n}\n\n/* O aviso flutuante hoje tem um nome só nos quatro motores. O `typeof` fica\n   porque referenciar identificador não declarado lança ReferenceError — foi\n   assim que a entrada na sala travou em \"Conectando...\" quando os nomes ainda\n   divergiam. */\nfunction _flutuante(txt){\n  if(typeof mostrarConquista === \"function\") mostrarConquista(txt);\n}\nfunction _avisoSala(txt){\n  const e = document.getElementById(\"salaEstado\");\n  if(e) e.textContent = txt;\n  _flutuante(txt);\n}\n\n/* ---------- lado do telão ---------- */\nasync function criarSala(){\n  _tela(\"salaAnfitriao\");\n  document.getElementById(\"salaCodigoTela\").textContent = \"....\";\n  try{ await _carregarPeer(); }\n  catch(e){\n    document.getElementById(\"salaCodigoTela\").textContent = \"!\";\n    document.getElementById(\"salaDica\").innerHTML =\n      \"<b>Sem internet.<\/b> Este modo precisa de conexão; o resto do jogo funciona offline.\";\n    return;\n  }\n  _souTelao = true;\n  _montarMissoes();\n  _pintarJogadores();   // sem isto a área fica vazia e ninguém entende a espera\n  _tentarCodigo(0);\n}\n\nfunction _tentarCodigo(tentativa){\n  if(tentativa > 5){\n    document.getElementById(\"salaDica\").textContent =\n      \"Não consegui abrir uma sala agora. Tente de novo em alguns segundos.\";\n    return;\n  }\n  const codigo = String(Math.floor(1000 + Math.random() * 9000));\n  if(_peer) try{ _peer.destroy(); }catch(e){}\n  _peer = new Peer(SALA_PREFIXO + codigo);\n  _peer.on(\"open\", () => {\n    document.getElementById(\"salaCodigoTela\").textContent = codigo;\n    location.hash = \"sala/\" + codigo;\n  });\n  // Código já em uso (ou por outra família): sorteia outro.\n  _peer.on(\"error\", err => {\n    if(err && err.type === \"unavailable-id\") _tentarCodigo(tentativa + 1);\n  });\n  _peer.on(\"connection\", con => {\n    con.on(\"data\", d => _doJogador(con, d));\n    con.on(\"close\", () => { _jogadores.delete(con.peer); _pintarJogadores(); });\n  });\n}\n\nfunction _doJogador(con, d){\n  if(d.t === \"entrar\"){\n    if(_iPergunta >= 0){ con.send({t: \"recusado\", motivo: \"A partida já começou.\"}); return; }\n    if(_jogadores.size >= SALA_MAX){ con.send({t: \"recusado\", motivo: \"A sala está cheia.\"}); return; }\n    _jogadores.set(con.peer, {nome: (d.nome || \"Jogador\").slice(0, 12), pontos: 0, con});\n    con.send({t: \"aceito\"});\n    _pintarJogadores();\n    if(typeof sfx !== \"undefined\") sfx.toque();\n  }\n  if(d.t === \"resposta\"){\n    const j = _jogadores.get(con.peer);\n    if(!j || j.respondeu || d.i !== _iPergunta) return;\n    j.respondeu = true;\n    const q = _perguntas[_iPergunta];\n    const certo = d.escolha === q.answer;\n    // Fórmula do Kahoot: acertar vale 1000, e a demora come até metade.\n    j.ganho = certo ? Math.max(1, Math.round(1000 * (1 - (d.ms / SALA_PRAZO) / 2))) : 0;\n    j.pontos += j.ganho;\n    con.send({t: \"recebido\", certo});\n    if([..._jogadores.values()].every(x => x.respondeu)) _fecharPergunta();\n  }\n}\n\nfunction _pintarJogadores(){\n  const c = document.getElementById(\"salaJogadores\");\n  c.innerHTML = [..._jogadores.values()]\n    .map(j => '<span class=\"sala-jogador\">' + _escapar(j.nome) + \"<\/span>\").join(\"\")\n    || '<span class=\"sala-dica\">Ninguém entrou ainda.<\/span>';\n  // Um botão desativado sem motivo é um beco: o rótulo passa a dizer por que.\n  const b = document.getElementById(\"salaComecar\");\n  b.disabled = _jogadores.size === 0;\n  b.textContent = _jogadores.size === 0 ? \"Esperando jogadores...\"\n    : \"Começar com \" + _jogadores.size + (_jogadores.size === 1 ? \" jogador\" : \" jogadores\");\n}\nfunction _escapar(t){\n  return String(t).replace(/[&<>\"]/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\n}\nfunction _enviarTodos(m){ _jogadores.forEach(j => { try{ j.con.send(m); }catch(e){} }); }\n\nfunction _montarMissoes(){\n  const sel = document.getElementById(\"salaMissao\");\n  sel.innerHTML = \"\";\n  _catalogoMissoes().forEach(([id, nome]) => {\n    const o = document.createElement(\"option\");\n    o.value = id; o.textContent = nome; sel.appendChild(o);\n  });\n}\n\nfunction comecarSala(){\n  const cat = document.getElementById(\"salaMissao\").value;\n  _perguntas = _perguntasSala(cat).filter(q => q.choices && q.answer != null).slice(0, 10);\n  if(!_perguntas.length){ _avisoSala(\"Essa missão não tem perguntas de escolha.\"); return; }\n  _iPergunta = -1;\n  _tela(\"salaJogo\");\n  _proximaPergunta();\n}\n\nfunction _proximaPergunta(){\n  _iPergunta++;\n  if(_iPergunta >= _perguntas.length) return _fimSala();\n  const q = _perguntas[_iPergunta];\n  _jogadores.forEach(j => { j.respondeu = false; j.ganho = 0; });\n  document.getElementById(\"salaProgresso\").textContent =\n    \"Pergunta \" + (_iPergunta + 1) + \" de \" + _perguntas.length;\n  document.getElementById(\"salaPergunta\").textContent = q.q;\n  document.getElementById(\"salaOpcoes\").innerHTML = q.choices.map((c, i) =>\n    '<div class=\"answer\"><span class=\"letra\">' + FORMAS[i % 4] + \"<\/span><span>\"\n    + _escapar(c) + \"<\/span><\/div>\").join(\"\");\n  document.getElementById(\"salaPlacar\").innerHTML = \"\";\n  _enviarTodos({t: \"pergunta\", i: _iPergunta, n: q.choices.length, prazo: SALA_PRAZO});\n  _tInicio = Date.now();\n  _contar();\n}\n\nfunction _contar(){\n  clearInterval(_relogio);\n  const el = document.getElementById(\"salaTempo\");\n  const tique = () => {\n    const resta = Math.max(0, SALA_PRAZO - (Date.now() - _tInicio));\n    el.textContent = Math.ceil(resta / 1000);\n    el.classList.toggle(\"urgente\", resta <= 5000);\n    if(resta <= 0) _fecharPergunta();\n  };\n  tique();\n  _relogio = setInterval(tique, 250);\n}\n\nfunction _fecharPergunta(){\n  clearInterval(_relogio);\n  const q = _perguntas[_iPergunta];\n  document.getElementById(\"salaOpcoes\").querySelectorAll(\".answer\")\n    .forEach((e, i) => e.classList.add(i === q.answer ? \"correct\" : \"wrong\"));\n  const ordem = [..._jogadores.values()].sort((a, b) => b.pontos - a.pontos);\n  document.getElementById(\"salaPlacar\").innerHTML = ordem.map((j, i) =>\n    '<div class=\"sala-linha' + (j.ganho ? \"\" : \" errou\") + '\"><span>' + (i + 1)\n    + \"<\/span><b>\" + _escapar(j.nome) + \"<\/b><span class=\\\"ganho\\\">+\" + (j.ganho || 0)\n    + \"<\/span><span>\" + j.pontos + \"<\/span><\/div>\").join(\"\");\n  _enviarTodos({t: \"resultado\", certa: q.answer,\n                placar: ordem.map(j => ({nome: j.nome, pontos: j.pontos, ganho: j.ganho || 0}))});\n  if(typeof sfx !== \"undefined\") sfx.etapa();\n  setTimeout(_proximaPergunta, 4000);\n}\n\nfunction _fimSala(){\n  const ordem = [..._jogadores.values()].sort((a, b) => b.pontos - a.pontos);\n  document.getElementById(\"salaProgresso\").textContent = \"Fim!\";\n  document.getElementById(\"salaTempo\").textContent = \"\";\n  document.getElementById(\"salaPergunta\").textContent =\n    ordem.length ? ordem[0].nome + \" venceu!\" : \"Fim da partida\";\n  document.getElementById(\"salaOpcoes\").innerHTML = \"\";\n  _enviarTodos({t: \"fim\", placar: ordem.map(j => ({nome: j.nome, pontos: j.pontos}))});\n  if(typeof festa === \"function\"){ festa(80); palmas(); }\n}\n\nfunction fecharSala(){\n  clearInterval(_relogio);\n  _enviarTodos({t: \"encerrada\"});\n  try{ _peer && _peer.destroy(); }catch(e){}\n  _peer = null; _souTelao = false; _jogadores.clear(); _iPergunta = -1;\n  goHome();\n}\n\n/* ---------- lado do jogador ---------- */\nasync function entrarSala(){\n  const codigo = (document.getElementById(\"salaCodigo\").value || \"\").replace(/\\D/g, \"\");\n  const nome = (document.getElementById(\"salaNome\").value || \"\").trim() || \"Jogador\";\n  if(codigo.length !== 4){ _flutuante(\"O código tem 4 números.\"); return; }\n  _tela(\"salaJogador\");\n  _avisoSala(\"Conectando...\");\n  try{ await _carregarPeer(); }\n  catch(e){ _avisoSala(\"Sem internet. Este modo precisa de conexão.\"); return; }\n  // Se o peer não abrir, não há nem conexão para dar erro: sem este prazo a\n  // tela fica em \"Conectando...\" para sempre.\n  let peerPronto = false;\n  setTimeout(() => { if(!peerPronto) _avisoSala(\"Não consegui falar com o servidor de encontro. Verifique a internet.\"); }, 12000);\n  _peer = new Peer();\n  _peer.on(\"open\", () => {\n    peerPronto = true;\n    _conAnfitriao = _peer.connect(SALA_PREFIXO + codigo);\n    let abriu = false;\n    _conAnfitriao.on(\"open\", () => { abriu = true; _conAnfitriao.send({t: \"entrar\", nome}); });\n    _conAnfitriao.on(\"data\", d => _doTelao(d));\n    _conAnfitriao.on(\"close\", () => _avisoSala(\"O telão encerrou a sala.\"));\n    // O telão respondeu mas o canal não abriu: é a rede no meio. Acontece\n    // quando os dois lados estão atrás de NAT restritivo — dados móveis, por\n    // exemplo. Sem um servidor de relé não há o que fazer daqui, então o\n    // aviso diz o que resolve na prática.\n    setTimeout(() => {\n      if(!abriu) _avisoSala(\"Não consegui conectar ao telão. \"\n        + \"Ponha os dois aparelhos no mesmo Wi-Fi e tente de novo.\");\n    }, 12000);\n  });\n  _peer.on(\"error\", e => _avisoSala(\n    e && e.type === \"peer-unavailable\" ? \"Não achei essa sala. Confira o código.\"\n                                       : \"Falha de conexão. Tente de novo.\"));\n}\n\nfunction _doTelao(d){\n  const estado = document.getElementById(\"salaEstado\");\n  const botoes = document.getElementById(\"salaBotoes\");\n  const placar = document.getElementById(\"salaMeuPlacar\");\n  if(d.t === \"aceito\"){ _avisoSala(\"Você entrou! Esperando começar...\"); }\n  if(d.t === \"recusado\"){ _avisoSala(d.motivo); }\n  if(d.t === \"pergunta\"){\n    placar.innerHTML = \"\";\n    estado.textContent = \"Responda!\";\n    botoes.innerHTML = \"\";\n    const t0 = Date.now();\n    for(let i = 0; i < d.n; i++){\n      const b = document.createElement(\"button\");\n      b.type = \"button\"; b.className = \"answer\";\n      b.innerHTML = '<span class=\"letra\">' + FORMAS[i % 4] + \"<\/span>\";\n      b.setAttribute(\"aria-label\", \"Alternativa \" + FORMAS[i % 4]);\n      b.onclick = () => {\n        botoes.querySelectorAll(\".answer\").forEach(x => { x.disabled = true; });\n        b.classList.add(\"escolhida\");\n        estado.textContent = \"Resposta enviada!\";\n        _conAnfitriao.send({t: \"resposta\", i: d.i, escolha: i, ms: Date.now() - t0});\n        if(typeof sfx !== \"undefined\") sfx.toque();\n      };\n      botoes.appendChild(b);\n    }\n  }\n  if(d.t === \"recebido\"){\n    estado.textContent = d.certo ? \"Acertou!\" : \"Dessa vez não.\";\n    if(typeof sfx !== \"undefined\") d.certo ? sfx.acerto() : sfx.erro();\n  }\n  if(d.t === \"resultado\" || d.t === \"fim\"){\n    botoes.innerHTML = \"\";\n    if(d.t === \"fim\"){\n      estado.textContent = d.placar.length ? d.placar[0].nome + \" venceu!\" : \"Fim\";\n      if(typeof festa === \"function\") festa(50);\n    }\n    placar.innerHTML = d.placar.map((j, i) =>\n      '<div class=\"sala-linha\"><span>' + (i + 1) + \"<\/span><b>\" + _escapar(j.nome)\n      + '<\/b><span class=\"ganho\">' + (j.ganho ? \"+\" + j.ganho : \"\") + \"<\/span><span>\"\n      + j.pontos + \"<\/span><\/div>\").join(\"\");\n  }\n  if(d.t === \"encerrada\"){ _avisoSala(\"O telão encerrou a sala.\"); }\n}\n\n/* ---------- entrada pela rota ---------- */\nfunction abrirSala(codigo){\n  show(\"sala\");\n  _tela(_souTelao ? \"salaAnfitriao\" : \"salaEscolha\");\n  if(codigo && !_souTelao){\n    mostrarEntrada();\n    document.getElementById(\"salaCodigo\").value = codigo;\n  }\n}\nROTAS.sala = abrirSala;\n\nfunction _catalogoMissoes(){\n  return Object.keys(nomes).filter(c => c !== \"review\").map(c => [c, nomes[c]]);\n}\nfunction _perguntasSala(cat){ return makeQuestions(cat, 10); }\n\n/* ---------- seletor de perfil no cabeçalho ---------- */\nfunction pintarPerfil(){\n  const b = document.getElementById(\"btnPerfil\");\n  if(!b) return;\n  const p = perfilAtual();\n  b.textContent = p ? inicialDe(p.nome) : \"?\";\n  b.style.background = p ? \"var(\" + p.cor + \")\" : \"\";\n  b.setAttribute(\"aria-label\", p ? \"Perfil: \" + p.nome + \". Trocar de aluno\"\n                                 : \"Escolher quem está jogando\");\n  b.title = p ? p.nome : \"Escolher aluno\";\n}\nfunction abrirPerfis(){ location.href = \"index.html#perfis\"; }\naddEventListener(\"DOMContentLoaded\", pintarPerfil);\n\n/* ---------- histórico de partidas ---------- */\n/* Uma linha por partida terminada. Campos curtos: isto cresce sem parar e\n   divide os 5 MB do localStorage com o progresso. */\nconst HIST_CHAVE = \"jogos_historico_v1\";\nconst HIST_MAX = 400;\n\nfunction registrarPartida(acertos, total, pontos){\n  if(!total) return;                       // saiu antes de responder: não conta\n  try{\n    const p = perfilAtual();\n    const k = HIST_CHAVE + (p ? \":\" + p.id : \"\");\n    const lista = JSON.parse(localStorage.getItem(k) || \"[]\");\n    lista.push({q: Date.now(), j: \"%SLUG%\", m: currentCategory || \"all\",\n                t: activeTrail || null, a: acertos, n: total, p: pontos || 0});\n    while(lista.length > HIST_MAX) lista.shift();\n    localStorage.setItem(k, JSON.stringify(lista));\n  }catch(e){}\n}\n<\/script><\/body><\/html>\n";
/* Monta um jogo no navegador: o mesmo que `build/montar.py` faz no build,
   para o jogo que a tela de gerar salvou na conta.

   O molde é o mesmo motor dos jogos feitos à mão (`motor/ceu.molde.html`),
   chegando aqui com o sprite já preenchido e as fendas do conteúdo vazias.
   O banco, os nomes e as trilhas saem do JSON como em `build/conteudo.py`; a
   capa e os cartões, que nos jogos à mão são escritos para cada um, saem de
   um modelo único. Não há lição: ela é feita à mão, por conteúdo.

   `teste/esteira/montar_jogo.test.ts` cobra que o banco montado aqui seja o
   mesmo que o Python monta, sobre os jogos de `conteudo/`. */

const MJ_FIXAS = [["all", "Desafio misto"], ["review", "Revisão dos meus erros"]];
const MJ_TIPOS = {vf: "tf", digitar: "text", ordenar: "order", ligar: "match", bussola: "compass"};

/* Literal JavaScript para dentro de um script: JSON serve, mas a barra
   seguida de "script" num enunciado fecharia a tag. (Este arquivo vai
   inteiro para dentro de uma tag script: nem o comentário pode trazê-la.) */
const mjJs = v => JSON.stringify(v).replace(/<\//g, "<\\/");
const mjHtml = t => String(t).replace(/[&<>"']/g, c =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);

function mjQuestao(q){
  const p = ["ic:" + mjJs(q.icone)];
  if(q.fonte){
    const f = q.fonte;
    p.push("src:" + mjJs(f && typeof f === "object" ? {t: f.tipo, d: f.detalhe} : f));
  }
  if(MJ_TIPOS[q.tipo]) p.push("t:" + mjJs(MJ_TIPOS[q.tipo]));
  p.push("q:" + mjJs(q.enunciado));
  if(q.tipo === "escolha"){ p.push("c:" + mjJs(q.certa)); p.push("d:" + mjJs(q.erradas)); }
  else if(q.tipo === "vf") p.push("c:" + (q.certa ? "true" : "false"));
  else if(q.tipo === "digitar"){ p.push("valid:" + mjJs(q.aceitas)); p.push("ph:" + mjJs(q.exemplo || "")); }
  else if(q.tipo === "ordenar") p.push("seq:" + mjJs(q.sequencia));
  else if(q.tipo === "ligar") p.push("pairs:" + mjJs(q.pares));
  else if(q.tipo === "bussola") p.push("target:" + mjJs(q.alvo));
  if(q.explicacao) p.push("e:" + mjJs(q.explicacao));
  return "{" + p.join(",") + "}";
}

/* O id da missão vira chave de objeto sem aspas: só identificador passa. */
const mjId = id => /^[A-Za-z_$][\w$]*$/.test(id) ? id : mjJs(id);

function mjBank(jogo){
  const por = new Map();
  for(const q of jogo.questoes){
    if(!por.has(q.missao)) por.set(q.missao, []);
    por.get(q.missao).push(q);
  }
  return "const bank={\n" + [...por].map(([m, l]) =>
    mjId(m) + ":[\n" + l.map(mjQuestao).join(",\n") + "]").join(",\n") + "\n};";
}

function mjNomes(jogo){
  const itens = [...MJ_FIXAS, ...jogo.missoes.map(m => [m.id, m.nome])];
  return "const nomes={" + itens.map(([k, v]) => mjId(k) + ":" + mjJs(v)).join(",") + "};";
}

function mjTrilhas(jogo){
  return "const trails={" + jogo.trilhas.map(t =>
    mjId(t.id) + ":{name:" + mjJs(t.nome) + ",steps:" + mjJs(t.etapas) + "}").join(",") + "};";
}

/* O desenho de uma missão é o mais usado nas questões dela. */
function mjIconeDa(jogo, id){
  const conta = {};
  jogo.questoes.filter(q => q.missao === id).forEach(q => { conta[q.icone] = (conta[q.icone] || 0) + 1; });
  return Object.keys(conta).sort((a, b) => conta[b] - conta[a])[0] || "livro";
}

const mjSvg = n => '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-'
  + mjHtml(n) + '"/></svg>';

function mjCapa(jogo){
  const assuntos = jogo.missoes.map(m => m.nome);
  const resumo = assuntos.length > 1 ? assuntos.slice(0, -1).join(", ") + " e " + assuntos.at(-1) : assuntos[0] || "";
  return '<section id="start" class="screen active"><div class="hero"><div class="icon"></div><h2>'
    + mjHtml(jogo.materia + " — " + jogo.titulo) + "</h2><p>" + mjHtml(resumo) + "</p>"
    + '<div id="startStats" class="chips"></div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'
    + '<button class="gold" onclick="openCategories()">Ir aos desafios</button>'
    + '<button type="button" class="ghost sala-abrir" onclick="irPara(\'sala\')"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-pessoas"/></svg> Jogar com outras pessoas</button>'
    + '</div><div style="margin-top:10px"><button class="link-btn" onclick="resetProgress()">apagar progresso salvo</button></div></div></section>';
}

function mjCartoes(jogo){
  const nome = id => (jogo.missoes.find(m => m.id === id) || {}).nome || id;
  const trilhas = jogo.trilhas.map((t, i) =>
    '<button class="trail-card' + (i ? "" : " recommended") + '" data-trail="' + mjHtml(t.id)
    + '" onclick="startTrail(' + mjHtml(mjJs(t.id)) + ')">' + mjSvg(mjIconeDa(jogo, t.etapas[0]))
    + "<strong>" + mjHtml(t.nome) + '<span class="trail-done">✓ concluída</span></strong><small>'
    + mjHtml(t.etapas.map(e => e === "all" ? "Desafio misto" : nome(e)).join(" → ")) + ".</small></button>").join("");
  const missoes = jogo.missoes.map(m => {
    const n = jogo.questoes.filter(q => q.missao === m.id).length;
    return '<button class="category-card" data-cat="' + mjHtml(m.id) + '" onclick="startCategory('
      + mjHtml(mjJs(m.id)) + ')">' + mjSvg(mjIconeDa(jogo, m.id)) + "<strong>" + mjHtml(m.nome)
      + "</strong><small>" + n + (n === 1 ? " questão" : " questões")
      + '</small><div class="mini-bar"><span></span></div><div class="mini-txt"></div></button>';
  }).join("");
  return '<div class="trail-grid">' + trilhas + '</div><h2 style="margin-top:24px">Ou escolha um conteúdo</h2>'
    + '<div class="category-grid" id="gradeMissoes"><h3 class="grupo">Atalhos</h3>'
    + '<button class="category-card" data-cat="review" onclick="startCategory(\'review\')">' + mjSvg("remendo")
    + '<strong>Revisar meus erros</strong><small>Só o que você vem errando, para atacar o ponto fraco.</small><span class="review-count"></span></button>'
    + '<button class="category-card" data-cat="all" onclick="startCategory(\'all\')">' + mjSvg("dado")
    + '<strong>Tudo misturado</strong><small>Todos os conteúdos em uma única partida.</small><div class="mini-bar"><span></span></div><div class="mini-txt"></div></button>'
    + '<h3 class="grupo">Conteúdos</h3>' + missoes
    + '<p id="semResultado" class="sem-resultado" hidden>Nenhuma missão com esse nome.</p></div>';
}

/* A cor da matéria, a mesma dos jogos feitos à mão; matéria nova fica com
   o azul da casa. */
const MJ_CORES = {"ciências": "oklch(0.40 0.19 285)", "geografia": "oklch(0.46 0.12 245)",
  "história": "oklch(0.60 0.18 40)", "matemática": "oklch(0.52 0.22 298)",
  "gramática": "oklch(0.55 0.11 82)", "língua portuguesa": "oklch(0.55 0.11 82)",
  "português": "oklch(0.55 0.11 82)", "inglês": "oklch(0.55 0.20 265)", "arte": "oklch(0.56 0.22 330)"};

/* `id` é o da linha em `jogos`: dele saem a chave do progresso e a sala,
   para dois jogos gerados nunca dividirem progresso. */
function montarJogo(molde, jogo, id){
  const curto = String(id).replace(/[^a-z0-9]/gi, "").slice(0, 12).toLowerCase();
  const troca = {
    "%PATENTE%": "lives<=0&&!practiceMode?'Aprendiz':acc>=90?'Mestre':acc>=70?'Estudante':'Aprendiz'",
    "%COR%": MJ_CORES[String(jogo.materia).trim().toLowerCase()] || "oklch(0.55 0.20 265)",
    "%TITULO%": mjHtml(jogo.titulo), "%CHAVE%": "gerado_" + curto + "_progress_v1",
    "%MATERIA%": mjHtml(jogo.materia), "%SUBTITULO%": mjHtml(jogo.materia + " — " + jogo.titulo),
    "%SALA%": "jogosdeestudo-g" + curto + "-", "%SLUG%": "g_" + curto,
  };
  let s = molde
    .replace("<!--%HERO%-->", () => mjCapa(jogo))
    .replace("<!--%LICAO%-->", '<section id="lesson" class="screen"></section>')
    .replace("<!--%CARTOES%-->", () => mjCartoes(jogo))
    .replace("/*%BANK%*/", () => mjBank(jogo))
    .replace("/*%NOMES%*/", () => mjNomes(jogo))
    .replace("/*%TRAILS%*/", () => mjTrilhas(jogo));
  for(const [marca, valor] of Object.entries(troca)) s = s.split(marca).join(valor);
  const sobrou = s.match(/%[A-Z]+%/g);
  if(sobrou) throw new Error("fendas não preenchidas: " + [...new Set(sobrou)].join(", "));
  return s;
}


/* O jogo fica guardado neste aparelho depois da primeira abertura: abre de
   novo sem internet, e sem a conta, como os jogos feitos à mão. */
const GUARDA = id => "jogo_gerado_" + id;

function aviso(titulo, texto, link){
  const m = document.getElementById("espera");
  m.replaceChildren();
  const h = document.createElement("h1"); h.textContent = titulo;
  const p = document.createElement("p"); p.textContent = texto;
  m.append(h, p);
  if(link){ const a = document.createElement("a"); a.className = "botao"; a.href = link[1]; a.textContent = link[0]; m.append(a); }
}

async function buscar(id){
  const {createClient} = await import(CONTA_LIB);
  const sb = createClient(CONTA.url, CONTA.chave);
  const {data: s} = await sb.auth.getSession();
  if(!s.session) return {sessao: false};
  const {data, error} = await sb.from("jogos").select("titulo,materia,conteudo").eq("id", id).maybeSingle();
  if(error) throw error;
  return {sessao: true, jogo: data && data.conteudo};
}

async function abrir(){
  const id = new URLSearchParams(location.search).get("id") || "";
  if(!/^[0-9a-f-]{36}$/i.test(id))
    return aviso("Jogo não encontrado", "O endereço está incompleto.", ["Voltar aos jogos", "index.html"]);
  let jogo = null, r = null;
  try{ jogo = JSON.parse(localStorage.getItem(GUARDA(id))); }catch(e){}
  try{ r = await buscar(id); }catch(e){}
  // O da conta vence o guardado: pode ter sido editado em outro aparelho.
  if(r && r.jogo){ jogo = r.jogo; try{ localStorage.setItem(GUARDA(id), JSON.stringify(jogo)); }catch(e){} }
  if(!jogo){
    if(r && !r.sessao) return aviso("Entre na conta", "Este jogo foi criado na conta da família. Entre nela pela página inicial e volte.",
                                    ["Entrar na conta", "index.html#conta"]);
    if(r) return aviso("Jogo não encontrado", "Ele foi apagado, ou é de outra conta.", ["Voltar aos jogos", "index.html"]);
    return aviso("Sem conexão", "Na primeira vez, o jogo precisa da internet para chegar. Depois abre sem ela.",
                 ["Voltar aos jogos", "index.html"]);
  }
  let html;
  try{ html = montarJogo(MOLDE, jogo, id); }
  catch(e){ return aviso("Este jogo não abriu", "O conteúdo salvo está fora do formato: " + e.message, ["Voltar aos jogos", "index.html"]); }
  document.open(); document.write(html); document.close();
}
abrir();
</script>
