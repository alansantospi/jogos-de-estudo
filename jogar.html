ateria-clara);color:var(--materia-forte);\n  border-radius:999px;padding:var(--s-1) var(--s-3);margin-bottom:var(--s-3);\n  font-family:var(--display);font-size:var(--t-xs);font-weight:600}\n.fonte{display:inline-block;margin-left:var(--s-2);margin-bottom:var(--s-3);\n  border:2px dashed var(--risco);border-radius:999px;padding:2px var(--s-3);\n  font-size:var(--t-xs);font-weight:700;color:var(--texto-3)}\n.storyline{font-size:var(--t-sm);color:var(--texto-2);margin-bottom:var(--s-3);\n  display:flex;align-items:baseline;gap:var(--s-2)}\n/* Ícone dentro de uma linha de texto. Sem tamanho próprio o <svg> estica\n   até preencher o contêiner — foi o que inchou a linha da missão. */\n.ic-txt{width:1.1em;height:1.1em;flex:none;align-self:center}\n/* Ilustração da questão: chip com a cor da matéria, acima do enunciado. */\n.illustration{\n  display:grid;justify-self:start;place-items:center;width:4rem;height:4rem;padding:0.85rem;\n  background:var(--materia-clara);border-radius:var(--r);color:var(--materia-forte);\n  margin-bottom:var(--s-3);box-sizing:border-box;min-height:0;font-size:0}\n.illustration svg{width:100%;height:100%;stroke-width:1.8}\n.question{position:relative;font-family:var(--display);font-size:var(--t-2xl);font-weight:600;\n  line-height:1.25;margin:0 0 var(--s-5);max-width:32ch}\n.hint{font-size:var(--t-sm);color:var(--texto-2);margin-bottom:var(--s-4)}\n\n/* Alternativas: bloco grande, forma própria, cor própria. */\n.answers{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}\n.answer{\n  display:flex;align-items:center;justify-content:flex-start;gap:var(--s-3);width:100%;\n  text-align:left;min-height:4.5rem;padding:var(--s-3) var(--s-4);\n  background:var(--carta);border:2px solid var(--risco);border-radius:var(--r);\n  box-shadow:0 var(--labio) 0 var(--risco);\n  color:var(--texto);font-family:var(--corpo);font-size:var(--t-md);font-weight:700;line-height:1.35;\n  overflow:visible;position:relative}\n.answer::after{display:none}\n/* A letra é o marcador da alternativa: mesma função das formas do Kahoot,\n   sem a assinatura dele, e é como a professora se refere à resposta. */\n.answer .letra{\n  flex:none;width:2.5rem;height:2.5rem;display:grid;place-items:center;\n  border:0;border-radius:var(--r-p);color:#fff;background:var(--alt-1);\n  font-family:var(--display);font-size:var(--t-md);font-weight:700;line-height:1}\n.answer:nth-child(2) .letra{background:var(--alt-2)}\n.answer:nth-child(3) .letra{background:var(--alt-3)}\n.answer:nth-child(4) .letra{background:var(--alt-4)}\n.answer:hover:not(.correct):not(.wrong){border-color:var(--materia);color:var(--texto);\n  transform:translateY(-2px);box-shadow:0 calc(var(--labio) + 2px) 0 var(--materia-borda)}\n.answer:active{transform:translateY(var(--labio));box-shadow:0 0 0 var(--risco)}\n.answer.correct{background:var(--certo-claro);border-color:var(--certo);box-shadow:0 var(--labio) 0 var(--certo-forte);\n  animation:pulo 420ms var(--mola)}\n.answer.correct .letra{background:var(--certo-solida);color:var(--sobre-solida)}\n.answer.wrong{background:var(--errado-claro);border-color:var(--errado);box-shadow:0 var(--labio) 0 var(--errado-forte)}\n.answer.wrong .letra{background:var(--errado-solida);color:var(--sobre-solida)}\n@keyframes pulo{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}\n\n.feedback{display:none;margin-top:var(--s-4);padding:var(--s-4);border:2px solid var(--risco);\n  border-radius:var(--r);font-size:var(--t-sm);font-weight:600;line-height:1.55}\n.feedback.show{display:block;animation:sobe-bloco 240ms var(--saida)}\n@keyframes sobe-bloco{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n.feedback .rotulo{display:block;font-family:var(--display);font-size:var(--t-lg);font-weight:600;margin-bottom:var(--s-1)}\n.feedback.good{background:var(--certo-claro);border-color:var(--certo)}\n.feedback.good .rotulo{color:var(--certo-forte)}\n.feedback.bad{background:var(--errado-claro);border-color:var (--s-2) var(--s-4);\n  font-family:var(--corpo);font-size:16px;font-weight:700;background:var(--carta);color:var(--texto);\n  border:2px solid var(--risco);border-radius:var(--r)}\n.text-row input::placeholder,.input-row input::placeholder{color:var(--texto-3);font-weight:600}\n.text-row input:focus,.input-row input:focus{outline:none;border-color:var(--materia)}\n.rosa{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2);max-width:20rem;margin:var(--s-3) auto 0}\n.rosa-btn{aspect-ratio:1;display:grid;place-items:center;min-height:3.5rem;height:auto;padding:0;width:auto;\n  font-family:var(--display);font-weight:600;font-size:var(--t-md)}\n.rosa-btn.card{color:var(--materia)}\n.rosa-btn.centro{border-color:transparent;background:none;box-shadow:none;cursor:default;font-size:0}\n.rosa-btn.correct{background:var(--certo-claro);border-color:var(--certo);box-shadow:0 var(--labio) 0 var(--certo-forte)}\n.rosa-btn.wrong{background:var(--errado-claro);border-color:var(--errado);box-shadow:0 var(--labio) 0 var(--errado-forte)}\n.memory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:var(--s-2);margin-top:var(--s-3)}\n.memory-card{min-height:5rem;font-size:var(--t-sm);justify-content:center;text-align:center}\n.memory-card.revealed{border-color:var(--materia);background:var(--materia-clara)}\n.memory-card.matched{border-color:var(--certo);background:var(--certo-claro);opacity:.75;cursor:default}\n.crossword{display:grid;grid-template-columns:repeat(7,2.75rem);gap:3px;margin:var(--s-3) 0;justify-content:center}\n.cw-cell{width:2.75rem;height:2.75rem;border:2px solid var(--risco);border-radius:var(--r-p);background:var(--carta)}\n.cw-cell.cw-block{background:var(--fundo);border-color:var(--fundo)}\n.cw-cell input{width:100%;height:100%;min-height:0;border:0;background:none;text-align:center;\n  font-family:var(--display);font-size:var(--t-md);font-weight:600;text-transform:uppercase;color:var(--texto);padding:0}\n.clues{font-size:var(--t-sm);color:var(--texto-2);margin-bottom:var(--s-3);line-height:1.7}\n.wordsearch{display:grid;grid-template-columns:repeat(8,2.75rem);gap:3px;margin:var(--s-3) 0;justify-content:center}\n.ws-cell{width:2.75rem;height:2.75rem;display:grid;place-items:center;border:2px solid var(--risco);\n  border-radius:var(--r-p);background:var(--carta);font-family:var(--display);font-size:var(--t-md);\n  font-weight:600;cursor:pointer;user-select:none;touch-action:manipulation}\n.ws-cell.sel{border-color:var(--materia);background:var(--materia-clara)}\n.ws-cell.found{border-color:var(--certo);background:var(--certo-claro);color:var(--certo-forte)}\n.badge-row{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-3)}\n.badge{font-family:var(--display);font-size:var(--t-xs);font-weight:600;color:var(--materia-forte);\n  background:var(--materia-clara);border-radius:999px;padding:var(--s-1) var(--s-3)}\n.audio-row{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-4)}\n.audio-btn{min-height:2.75rem;padding:var(--s-2) var(--s-4);font-size:var(--t-sm);width:auto}\n\n/* ---------- fim de partida ---------- */\n.result{padding:var(--s-5) 0;max-width:40rem}\n.trophy{display:none}\n.result h2{font-size:var(--t-3xl);font-weight:700;margin-bottom:var(--s-2)}\n.rank{display:inline-block;background:var(--materia-solida);color:var(--sobre-materia);border-radius:999px;\n  padding:var(--s-2) var(--s-4);font-family:var(--display);font-size:var(--t-lg);font-weight:600;margin:0 0 var(--s-4)}\n.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:var(--s-3);margin:var(--s-5) 0}\n.stat{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:2px;\n  background:var(--carta);border:2px solid var(--risco);border-radius:var(--r);padding:var(--s-3) var(--s-4)}\n.stat strong{font-family:var(--display);font-size:var(--t-2xl);font-weight:700;\n  font-variant-numeric:tabular-nums;line-height:1.05;color:var(--materia)}\n.stat .small{font-size:var(--t-xs);color:var(--texto-2)}\n.missed{margin:var(--s-5) 0 0;padding:var(--s-4);background:var(--carta);\n  border:2px solid var(--risco);border-radius:var(--r-g)}\n.missed-title{font-family:var(--display);font-size:var(--t-lg);font-weight:600;margin-bottom:var(--s-3)}\n.missed-list{margin:0 0 var(--s-3);padding:0;list-style:none;\n  color:var(--texto-2);font-size:var(--t-sm);line-height:1.5}\n.missed-list li{display:flex;align-items:flex-start;gap:var(--s-2);\n  padding:var(--s-1) 0}\n.missed-list .ic-txt{margin-top:.15em;color:var(--materia-forte)}\n.missed-chips{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-bottom:var(--s-3)}\n.missed-chip{background:var(--materia-clara);color:var(--materia-forte);border-radius:999px;\n  padding:var(--s-1) var(--s-3);font-size:var(--t-xs);font-weight:700;\n  display:inline-flex;align-items:center;gap:var(--s-1)}\n\n/* ---------- navegação ---------- */\n/* Onde a criança está e como sair dali. Fica acima da faixa da matéria,\n   discreta, e some para trás do conteúdo em vez de competir com ele. */\n.migalhas{\n  display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-2);\n  max-width:56rem;margin:0 auto;padding:var(--s-3) var(--s-4) 0;\n  font-size:var(--t-sm);font-weight:700;color:var(--texto-2)}\n.migalhas a{display:inline-flex;align-items:center;gap:var(--s-1);\n  color:var(--texto-2);text-decoration:none;border-radius:var(--r-p);\n  padding:2px 4px;margin:-2px -4px}\n.migalhas a:hover{color:var(--materia-forte);text-decoration:underline}\n.migalhas a:focus-visible{outline:3px solid var(--materia);outline-offset:2px}\n.migalhas svg{width:1rem;height:1rem}\n.migalhas b{color:var(--texto);font-weight:800}\n.migalha-sep{color:var(--texto-3);user-select:none}\n\n/* ---------- busca de missão ---------- */\n/* Com 18 missões a lista já tem três telas de altura. Buscar é o que\n   escala sozinho: cada conteúdo novo entra sem manutenção nenhuma. */\n.busca{position:relative;margin:0 0 var(--s-4)}\n.busca svg{position:absolute;left:var(--s-3);top:50%;transform:translateY(-50%);\n  width:1.15rem;height:1.15rem;color:var(--texto-3);pointer-events:none}\n.busca input{\n  width:100%;min-height:3rem;padding:var(--s-2) var(--s-3) var(--s-2) 2.75rem;\n  background:var(--carta);color:var(--texto);\n  border:2px solid var(--risco);border-radius:999px;\n  font-family:var(--corpo);font-size:var(--t-md);font-weight:600;\n  -webkit-appearance:none;appearance:none}\n.busca input::placeholder{color:var(--texto-3)}\n.busca input:focus{outline:none;border-color:var(--materia)}\n.busca input:focus-visible{outline:3px solid var(--materia);outline-offset:2px}\n.grupo{\n  grid-column:1/-1;margin:var(--s-4) 0 0;\n  font-family:var(--display);font-size:var(--t-sm);font-weight:600;\n  color:var(--texto-2);letter-spacing:.02em}\n.grupo:first-child{margin-top:0}\n.sem-resultado{grid-column:1/-1;color:var(--texto-2);padding:var(--s-4) 0}\n[hidden]{display:none!important}\n\n/* ---------- avisos ---------- */\n/* O aviso nasce logo abaixo do cabeçalho — o JS mede e escreve --aviso-topo.\n   Antes ficava colado no topo da janela, em cima do cabeçalho, e como usava a\n   cor da matéria era azul sobre azul: 1,09:1, praticamente invisível. */\n.conquista,.achievement-pop{\n  position:fixed;left:50%;top:var(--aviso-topo,var(--s-4));\n  transform:translateX(-50%) translateY(-1.5rem) scale(.9);\n  z-index:20;background:var(--aviso);color:var(--sobre-aviso);\n  padding:var(--s-3) var(--s-5);border-radius:999px;\n  font-family:var(--display);font-size:var(--t-md);font-weight:600;\n  box-shadow:0 var(--labio) 0 var(--aviso-fundo),\n             0 0 0 2px rgb(255 255 255 / .16),\n             0 14px 30px rgb(0 0 0 / .34);\n  opacity:0;pointer-events:none;\n  transition:opacity 180ms var(--saida),transform 340ms var(--mola);\n  max-width:min(92vw,26rem);text-align:center}\n.conquista.show,.achievement-pop.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}\n\n/* Fim de etapa é uma virada de página, não um recado de passagem: diz onde a\n   criança estava e para onde vai. */\n.conquista.etapa,.achievement-pop.etapa{\n  border-radius:var(--r-g);padding:var(--s-4) var(--s-5);\n  display:grid;justify-items:center;gap:2px;max-width:min(94vw,25rem)}\n.conquista.etapa .aviso-t,.achievement-pop.etapa .aviso-t{\n  display:flex;align-items:center;gap:var(--s-2);white-space:nowrap;\n  font-size:var(--t-md);font-weight:700}\n.conquista.etapa .aviso-s,.achievement-pop.etapa .aviso-s{\n  font-family:var(--corpo);font-size:var(--t-sm);font-weight:700;opacity:.92}\n.conquista .ic-txt,.achievement-pop .ic-txt{width:1.2em;height:1.2em}\n\n/* O nó que acabou de fechar pisca ao virar verde: é o sinal de que a etapa\n   mudou, e não só o texto do aviso. */\n.node.fechou,.trail-node.fechou{animation:fechou 620ms var(--mola)}\n@keyframes fechou{\n  0%{transform:scale(1)}\n  35%{transform:scale(1.35)}\n  60%{transform:scale(.94)}\n  to{transform:scale(1)}}\n.floater{position:absolute;right:0;top:-0.75rem;font-family:var(--display);font-size:var(--t-xl);\n  font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none;\n  animation:sobe 950ms var(--saida) forwards;z-index:5}\n.floater.bom{color:var(--certo-forte)}\n.floater.ruim{color:var(--errado-forte)}\n@keyframes sobe{from{opacity:0;transform:translateY(8px) scale(.9)}\n  25%{opacity:1;transform:translateY(-2px) scale(1.06)}\n  to{opacity:0;transform:translateY(-2rem) scale(1)}}\n.combo-pulse{animation:pulo 420ms var(--mola)}\n.shake{animation:tremor 320ms var(--saida)}\n@keyframes tremor{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n\n@media(max-width:44rem){\n  .wrap{padding:var(--s-3) var(--s-3) var(--s-6)}\n  header{padding:var(--s-3) var(--s-4);border-radius:var(--r)}\n  .top{align-items:flex-start}\n  .hud{width:100%}\n  .pill{flex:1;justify-content:center;padding:var(--s-2)}\n  .answers,.truefalse,.match,.match-grid{grid-template-columns:1fr}\n  .question{font-size:var(--t-xl \n.sala-botoes .answer .letra{width:3rem;height:3rem;font-size:var(--t-xl)}\n.sala-botoes .answer.escolhida{border-color:var(--materia);box-shadow:0 0 0 3px var(--materia-borda)}\n@media(max-width:44rem){ .sala-caixa{padding:var(--s-4)} }\n\n/* ---------- perfil ---------- */\n.perfil-btn{\n  display:grid;place-items:center;min-width:2.5rem;min-height:2.5rem;padding:0;\n  border:2px solid rgba(255,255,255,.55);border-radius:999px;\n  background:var(--alt-1);color:#fff;\n  font-family:var(--display);font-size:var(--t-md);font-weight:700;line-height:1}\n.perfil-btn:hover{border-color:#fff}\n<\/style>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;900&display=swap\"><script>try{var t=localStorage.getItem(\"tema\");if(t&&t!==\"sistema\")document.documentElement.dataset.tema=t;}catch(e){}<\/script><\/head>\n<body><svg aria-hidden=\"true\" focusable=\"false\" style=\"position:absolute;width:0;height:0;overflow:hidden\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><defs><symbol id=\"i-alerta\" viewBox=\"0 0 24 24\"><path d=\"M12 3.5 22 20H2z\"/><path d=\"M12 10v4\"/><circle cx=\"12\" cy=\"17\" r=\".6\" fill=\"currentColor\"/><\/symbol><symbol id=\"i-alvo\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"4.5\"/><circle cx=\"12\" cy=\"12\" r=\"1\" fill=\"currentColor\"/><\/symbol><symbol id=\"i-ampulheta\" viewBox=\"0 0 24 24\"><path d=\"M6 3h12M6 21h12\"/><path d=\"M7 3c0 4 5 6 5 9s-5 5-5 9\"/><path d=\"M17 3c0 4-5 6-5 9s5 5 5 9\"/><\/symbol><symbol id=\"i-angulo-agudo\" viewBox=\"0 0 24 24\"><path d=\"M4 19h16\"/><path d=\"M4 19 17 7\"/><path d=\"M9 19a6 6 0 0 0 1.6-4\"/><\/symbol><symbol id=\"i-angulo-obtuso\" viewBox=\"0 0 24 24\"><path d=\"M4 18h17
